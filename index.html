<style>
:root{--bg:#0c1810;--bg-elev:#13241a;--bg-card:#173024;--bg-inset:#0b1610;--gold:#8fce6a;--gold-hi:#c8ef9a;--gold-lo:#3f7a38;--gold-soft:#a3c98a;--ivory:#eef6e6;--muted:#93b096;--line:#2a4030;--danger:#a85a4c;--serif:"EB Garamond","Libre Baskerville","Noto Serif KR","Batang","Times New Roman",serif;--sans:"Noto Serif KR","EB Garamond","Batang","Georgia",serif;--ui:"Noto Serif KR","EB Garamond",serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ivory);font-family:var(--sans)}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
.panel{border-radius:12px;padding:1.05rem;border:1px solid transparent;background:linear-gradient(color-mix(in oklab,var(--bg-card) 92%,transparent),color-mix(in oklab,var(--bg-card) 92%,transparent)) padding-box,linear-gradient(135deg,var(--gold-lo),var(--gold-hi),var(--gold),var(--gold-lo)) border-box}
h1,h2{font-family:var(--serif);font-weight:600}h1{font-style:italic;font-size:clamp(1.45rem,3vw,2.1rem);margin:.2rem 0}
.muted{color:var(--muted)}
.btn{min-height:40px;padding:0 .85rem;border-radius:6px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:.3rem}
.btn-gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));color:#1a1408;font-weight:600}
.btn.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo)) !important;color:#1a1408 !important;border-color:var(--gold) !important;font-weight:700}
.btn-line{border:1px solid color-mix(in oklab,var(--gold) 40%,transparent);background:transparent;color:var(--gold)}
.btn-ghost{background:none;border:0;color:var(--muted)}
.btn-danger{background:color-mix(in oklab,var(--danger) 22%,transparent);color:#ffb4a8;border:1px solid color-mix(in oklab,var(--danger) 40%,transparent)}
.field{display:block;margin-bottom:.8rem}.field span{display:block;font-size:11px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:.3rem}
.field input,.field textarea,.field select{width:100%;min-height:42px;border-radius:8px;border:1px solid color-mix(in oklab,var(--gold-lo) 55%,var(--line));background:linear-gradient(180deg,color-mix(in oklab,var(--bg-inset) 92%,#1a160c),var(--bg-inset));padding:.5rem .7rem;outline:none;color:var(--ivory);transition:border-color .15s,box-shadow .15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 1px color-mix(in oklab,var(--gold) 35%,transparent),0 0 12px color-mix(in oklab,var(--gold) 12%,transparent)}
.field textarea{min-height:96px;resize:vertical}
/* search panel accent */
.panel input#q{border:1px solid color-mix(in oklab,var(--gold) 45%,transparent);background:linear-gradient(180deg,#14281c,var(--bg-inset));font-family:var(--serif);letter-spacing:.02em}
.panel input#q:focus{border-color:var(--gold-hi);box-shadow:0 0 0 1px color-mix(in oklab,var(--gold) 40%,transparent),0 0 16px color-mix(in oklab,var(--gold) 15%,transparent)}
.panel input#q::placeholder{color:color-mix(in oklab,var(--muted) 70%,transparent)}
.hero{position:relative;border-radius:12px;overflow:hidden;min-height:13rem;border:1px solid color-mix(in oklab,var(--gold) 30%,transparent)}
.hero img{width:100%;height:15.5rem;object-fit:cover;display:block}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:1rem;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.hero .cap em{font-family:var(--serif);font-size:1.3rem}
.modal-back.no-anim,.modal.no-anim{animation:none !important}
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal-back{align-items:center;padding:1rem}}
.modal{width:min(100%,420px);max-height:92dvh;overflow:auto;border-radius:14px 14px 0 0;padding:1.1rem;background:var(--bg-elev);border:1px solid color-mix(in oklab,var(--gold) 30%,transparent)}
@media(min-width:640px){.modal{border-radius:14px}}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:120;background:var(--bg-elev);border:1px solid color-mix(in oklab,var(--gold) 40%,transparent);padding:.6rem 1rem;border-radius:8px}
.wiki-body{line-height:1.7;font-size:15px}.wiki-body h2{color:var(--gold);font-family:var(--serif)}
.wiki-body a.wiki-link{color:#ffe566;cursor:pointer;text-decoration:underline}
.grid-2{display:grid;gap:1rem}@media(min-width:900px){.grid-2{grid-template-columns:minmax(0,240px) 1fr}}
.profile-sq{aspect-ratio:1;width:100%;border-radius:8px;overflow:hidden;border:1px solid color-mix(in oklab,var(--gold) 40%,transparent);background:#0a0908}
.profile-sq img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;padding:1.8rem 1rem;color:var(--muted);border:1px dashed color-mix(in oklab,var(--gold) 25%,transparent);border-radius:10px}
.crumb{display:flex;flex-wrap:wrap;gap:.25rem;font-size:.8rem;color:var(--muted);margin-bottom:.7rem}
.crumb button{background:none;border:0;color:var(--muted);min-height:32px}
.lin-name{display:flex;flex-direction:column;align-items:flex-start;min-width:0;line-height:1.2}
.lin-name em{font-family:var(--serif);font-style:italic}
.lin-name .ko{color:var(--muted);font-size:.75rem}

.topbar{display:flex;align-items:center;gap:.55rem;padding:.5rem .8rem;border-bottom:1px solid color-mix(in oklab,var(--gold) 25%,transparent);background:color-mix(in oklab,var(--bg) 78%,transparent);backdrop-filter:blur(12px);position:sticky;top:0;z-index:30}
.icon-btn{min-width:40px;min-height:40px;border-radius:8px;border:1px solid color-mix(in oklab,var(--gold) 35%,transparent);background:color-mix(in oklab,var(--bg-card) 70%,transparent);color:var(--gold);display:grid;place-items:center;position:relative}
.brand-mini{display:flex;align-items:center;gap:.45rem;background:none;border:0;color:inherit}.brand-mini img{width:28px;height:28px}
.brand-mini strong{font-family:var(--serif);letter-spacing:.04em;font-size:.95rem;color:var(--gold)}
.spacer{flex:1}
.seg-wrap{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center;padding:.4rem .7rem;border-bottom:1px solid color-mix(in oklab,var(--gold) 18%,transparent);background:color-mix(in oklab,var(--bg) 70%,transparent);position:sticky;top:100px;z-index:25}
.seg-wrap.hidden{display:none}
.seg{min-height:38px;padding:0 .95rem;border-radius:999px;border:1px solid transparent;font-size:.86rem;letter-spacing:.04em;
  color:var(--gold-soft);
  background:linear-gradient(color-mix(in oklab,var(--bg-card) 70%,transparent),color-mix(in oklab,var(--bg-card) 70%,transparent)) padding-box,linear-gradient(135deg,var(--gold-lo),var(--gold-soft),var(--gold-lo)) border-box}
.seg:hover{color:var(--gold-hi);filter:brightness(1.08)}
.seg.on{color:#1a1408;font-weight:600;border-color:transparent;
  background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 45%,var(--gold-lo) 100%);
  box-shadow:0 2px 10px color-mix(in oklab,var(--gold) 25%,transparent)}
.shell{display:flex;flex:1;min-height:0;overflow:hidden;align-items:stretch}
.sidebar{width:250px;flex-shrink:0;border-right:1px solid color-mix(in oklab,var(--gold) 18%,transparent);background:color-mix(in oklab,var(--bg-elev) 94%,transparent);display:flex;flex-direction:column;min-height:0;height:100%;max-height:100%;overflow:hidden;align-self:stretch}
.sidebar.collapsed{width:0;overflow:hidden;border:0;padding:0}
.sidebar-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:.5rem .45rem .3rem}
.sidebar-scroll::-webkit-scrollbar{width:7px}
.sidebar-scroll::-webkit-scrollbar-track{background:color-mix(in oklab,var(--bg) 60%,transparent);border-radius:6px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gold-lo),var(--gold-soft),var(--gold-lo));border-radius:6px}
.sidebar-scroll{scrollbar-width:thin;scrollbar-color:var(--gold-lo) transparent}
.sidebar-species{flex-shrink:0;border-top:1px solid color-mix(in oklab,var(--gold) 15%,transparent);padding:.45rem .5rem .55rem;max-height:38%;overflow-y:auto;overscroll-behavior:contain}
.sidebar-species::-webkit-scrollbar{width:6px}
.sidebar-species::-webkit-scrollbar-thumb{background:var(--gold-lo);border-radius:6px}
.sp-mini{display:flex;align-items:center;gap:.45rem;width:100%;text-align:left;background:none;border:0;padding:.28rem .2rem;border-radius:6px;color:inherit;cursor:pointer}
.sp-mini:hover{background:color-mix(in oklab,var(--gold) 8%,transparent)}
.sp-mini img{width:28px;height:28px;border-radius:4px;object-fit:cover;background:#111;border:1px solid color-mix(in oklab,var(--gold) 25%,transparent);flex-shrink:0}
.sp-mini .sci{font-family:var(--serif);font-style:italic;font-size:.78rem;color:var(--gold-soft);line-height:1.2}
@media(max-width:768px){
  .sidebar,.sidebar.collapsed{display:none!important;width:0!important;border:0!important}

/* muted gold interactive + motion — GPU-friendly (transform/opacity) */

/* ===== Cinematic polish ===== */
@keyframes riseIn{
  from{opacity:0;transform:translateY(14px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes fadeSlide{
  from{opacity:0;transform:translateX(-10px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes softPop{
  0%{transform:scale(1)}
  40%{transform:scale(1.045)}
  100%{transform:scale(1)}
}
@keyframes goldShimmer{
  0%{background-position:0% 50%}
  100%{background-position:200% 50%}
}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 0 0 color-mix(in oklab,var(--gold) 0%,transparent)}
  50%{box-shadow:0 0 18px 0 color-mix(in oklab,var(--gold) 28%,transparent)}
}
@keyframes segUnderline{
  from{transform:scaleX(0);opacity:0}
  to{transform:scaleX(1);opacity:1}
}
@keyframes modalIn{
  from{opacity:0;transform:translateY(18px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes backdropIn{
  from{opacity:0}
  to{opacity:1}
}
@keyframes cardFloat{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}

.panel,.hero,.theater-stage,.sf-card,.sp-cell,.rank-row,.chat-row,.notif-item,.media-card{
  animation:riseIn .45s cubic-bezier(.22,1,.36,1) both;
}
.sf-card:nth-child(1),.sp-cell:nth-child(1),.media-card:nth-child(1){animation-delay:.02s}
.sf-card:nth-child(2),.sp-cell:nth-child(2),.media-card:nth-child(2){animation-delay:.05s}

#open-backlight{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  opacity:0;
  background:
    radial-gradient(circle 40% at 50% 45%,
      rgba(255,250,220,.95) 0%,
      rgba(255,220,120,.55) 22%,
      rgba(201,162,39,.28) 48%,
      transparent 70%),
    radial-gradient(ellipse 85% 60% at 50% 50%,
      rgba(255,210,100,.35) 0%,
      transparent 55%),
    conic-gradient(from 0deg at 50% 45%,
      transparent 0deg,
      rgba(255,230,150,.2) 40deg,
      transparent 80deg,
      rgba(255,200,80,.15) 140deg,
      transparent 180deg,
      rgba(255,230,150,.18) 240deg,
      transparent 300deg,
      rgba(255,210,100,.12) 330deg,
      transparent 360deg);
  mix-blend-mode:screen;
  filter:brightness(1.35) saturate(1.15);
}

  animation: openBacklight 2.5s ease-out forwards;
}

  0%{ opacity:0; transform:scale(.75) rotate(-8deg); filter:brightness(1.1) saturate(1); }

  65%{ opacity:.7; transform:scale(1.08) rotate(-2deg); filter:brightness(1.3); }

}

  backdrop-filter:blur(10px);
}
.nav-trail .btn{
  flex:1; max-width:7.5rem; min-height:40px;
  font-family:var(--serif); letter-spacing:.04em;
  border-color:color-mix(in oklab,var(--gold) 45%,transparent);
  color:var(--gold-soft);
  background:color-mix(in oklab,var(--bg-inset) 80%,transparent);
}
.nav-trail .btn:hover, .nav-trail .btn:active{
  border-color:var(--gold); color:var(--gold);
  box-shadow:0 0 0 1px color-mix(in oklab,var(--gold) 25%,transparent);
}
.nav-trail .btn.btn-gold{ background:linear-gradient(180deg, color-mix(in oklab,var(--gold) 35%,#1a1508), color-mix(in oklab,var(--gold) 18%,#04161d)); color:#1a1408; border-color:var(--gold); }
#root{ padding-bottom:0; }
.main{ padding-bottom:4.2rem; }

.tax-tree{list-style:none;margin:.35rem 0 0;padding:0}
.tax-tree>li{margin:.35rem 0;padding:0}
.tax-tree .tax-item{
  display:flex;align-items:center;gap:.45rem;width:100%;
  text-align:left;padding:.4rem .55rem;border-radius:8px;
  border:1px solid color-mix(in oklab,var(--gold) 16%,transparent);
  background:color-mix(in oklab,var(--bg-inset) 70%,transparent);
  font-family:inherit;color:inherit;cursor:pointer;
}
.tax-tree .tax-item:hover{border-color:color-mix(in oklab,var(--gold) 40%,transparent)}
.tax-tree .tax-item em{font-family:var(--serif);color:var(--gold-soft)}
.tax-tree ul{list-style:none;margin:.25rem 0 .45rem 1.05rem;padding:0 0 0 .65rem;border-left:2px solid color-mix(in oklab,var(--gold) 22%,transparent)}
.tax-tree ul li{margin:.22rem 0}
.tax-tree .tax-orphan{opacity:.95}
.tax-tree .tax-label{font-size:.72rem;color:var(--muted);margin:0 0 .2rem .15rem;letter-spacing:.04em}
/* [개선] 모바일 터치 피드백 및 스크롤바 미화 */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: var(--bg-inset);
}
::-webkit-scrollbar-thumb {
  background: var(--gold-lo);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--gold-hi);
}

/* [개선] 모달/드로어 로딩 애니메이션 및 가독성 향상 */
.modal-back {
  backdrop-filter: blur(4px);
}
.modal {
  box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px color-mix(in oklab, var(--gold) 20%, transparent);
}

/* [개선] 검색 결과 목록 호버 효과 */
.top-search-results .list-btn:hover {
  background: color-mix(in oklab, var(--gold) 15%, transparent);
  padding-left: 1rem;
}

</style>

const RANK_ORDER = ["clade","superfamily","family","subfamily","genus","species","breed"];
const CLADE_ORDER = [
  "Podotremata",
  "Marine Heterotremata",
  "Thoracotremata & True Freshwater Crab"
];
const CLADE_FILTERS = CLADE_ORDER;
function cladeSortKey(name){
  const n=String(name||"");
  const low=n.toLowerCase().replace(/&/g," ").replace(/\s+/g," ").trim();
  if(low.includes("podotrem")) return 0;
  if(low.includes("marine") && low.includes("heterotrem")) return 1;
  if((low.includes("thoracotrem") && low.includes("freshwater")) || (low.includes("thoracotremata") && low.includes("true"))) return 2;
  if(low.includes("thoracotrem") && !low.includes("freshwater")) return 3;
  if(low.includes("true freshwater") || (low.includes("freshwater") && !low.includes("thoracotrem"))) return 4;
  if(low.includes("heterotrem")) return 1;
  for(let i=0;i<CLADE_ORDER.length;i++){
    if(n===CLADE_ORDER[i]) return i;
  }
  return 50;
}
function orphanTaxa(){
  return Object.values(S.taxa||{}).filter(t=>{
    if(!t || t.rank==="clade") return false;
    if(!t.parentId) return true;
    return !S.taxa[t.parentId];
  }).sort((a,b)=>(a.scientificName||"").localeCompare(b.scientificName||""));
}
function orderedClades(){
  return Object.values(S.taxa).filter(t=>t.rank==="clade")
    .sort((a,b)=>cladeSortKey(a.scientificName)-cladeSortKey(b.scientificName)||a.scientificName.localeCompare(b.scientificName));
}
function cladeOf(taxon){
  let t=taxon, guard=0;
  while(t && guard++<24){
    if(t.rank==="clade") return t;
    t=t.parentId?S.taxa[t.parentId]:null;
  }
  return null;
}
function taxonMatchesCladeFilter(taxon, filter){
  if(!filter || filter==="all") return true;
  if(!taxon) return false;
  const cl=cladeOf(taxon);
  if(!cl) return false;
  const a=String(cl.scientificName||"").toLowerCase();
  const b=String(filter||"").toLowerCase();
  if(cladeSortKey(cl.scientificName)===cladeSortKey(filter)) return true;
  if(a===b) return true;
  const head=b.split("&")[0].trim();
  if(head && a.includes(head)) return true;
  return false;
}

function _sciName(t){ return String(t&&t.scientificName||"").replace(/^†\s*/,""); }
function _hasSci(t, name){
  const n=String(name).toLowerCase();

  while(cur && g++<24 && !seen.has(cur.id)){
    seen.add(cur.id);

  }

}

  if(CHERAX_N.some(x=>epi===x || blob.includes(x))) return "cherax-n";

  if(CHERAX_SW.some(x=>epi===x || blob.includes(x))) return "cherax-sw";

function crayCatOf(t){

function crayInCat(t, cat){

function crayUnits(cat){

function ornUnits(cat){

  const units=[], seen=new Set();

  const push=t=>{ if(listed(t) && !seen.has(t.id)){ seen.add(t.id); units.push(t); } };
  if(cat==="land"){
    Object.values(S.taxa).filter(x=>x.rank==="genus" && listed(x) && (_hasSci(x,"Gecarcinidae")||ORN_RULES.landGenera.some(n=>_sciName(x).toLowerCase()===n.toLowerCase()||_hasSci(x,n)))).forEach(g=>{
      push(g);
      childrenOf(g.id).filter(sp=>sp.rank==="species" && listed(sp)).sort((a,b)=>_sciName(a).localeCompare(_sciName(b))).forEach(push);
    });
  } else if(cat==="large"){
    const fams=Object.values(S.taxa).filter(x=>x.rank==="family" && listed(x) && (ORN_RULES.largeFamilies.some(n=>_sciName(x).toLowerCase()===n.toLowerCase()) || ORN_RULES.trueFwFamilies.some(n=>_sciName(x).toLowerCase()===n.toLowerCase()) || isTrueFwTaxon(x)));

    ORN_RULES.trueFwSuper.forEach(n=>{ const t=findTaxonBySci(n,"superfamily"); if(listed(t) && !supers.find(x=>x.id===t.id)) supers.push(t); });
    supers.sort((a,b)=>_sciName(a).localeCompare(_sciName(b))).forEach(sf=>{
      push(sf);

    });
    fams.filter(f=>!ancestorOfRank(f,"superfamily")).forEach(push);
    ORN_RULES.largeGenera.forEach(n=>push(findTaxonBySci(n,"genus")));

    Object.values(S.taxa).filter(x=>x.rank==="genus" && ornCatOf(x)!=="land" && ornCatOf(x)!=="large").forEach(g=>{
      const kids=childrenOf(g.id).some(sp=>sp.rank==="species" && listed(sp));

    });
  }
  return units;
}

async function compressImageFile(file, maxSide, quality){
  maxSide=maxSide||512; quality=quality==null?0.82:quality;
  const dataUrl=await new Promise(function(res,rej){ const r=new FileReader(); r.onload=function(){res(r.result)}; r.onerror=rej; r.readAsDataURL(file); });
  const img=await new Promise(function(res,rej){ const i=new Image(); i.onload=function(){res(i)}; i.onerror=rej; i.src=dataUrl; });
  const scale=Math.min(1, maxSide/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*scale)), hh=Math.max(1,Math.round(img.height*scale));
  const c=document.createElement("canvas"); c.width=w; c.height=hh;
  c.getContext("2d").drawImage(img,0,0,w,hh);
  return c.toDataURL("image/jpeg", quality);
}

function lineDiff(a,b){
  const A=String(a||"").replace(/\r\n/g,"\n").split("\n");
  const B=String(b||"").replace(/\r\n/g,"\n").split("\n");
  const n=Math.min(A.length,400), m=Math.min(B.length,400);
  const aa=A.slice(0,n), bb=B.slice(0,m);
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++)
    dp[i][j]=aa[i-1]===bb[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const out=[];
  let i=n,j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&aa[i-1]===bb[j-1]){ out.push({t:"same",text:aa[i-1]}); i--; j--; }
    else if(j>0&&(i===0||dp[i][j-1]>=dp[i-1][j])){ out.push({t:"add",text:bb[j-1]}); j--; }
    else { out.push({t:"del",text:aa[i-1]}); i--; }
  }
  out.reverse();
  if(A.length>n||B.length>m) out.push({t:"same",text:"… (이하 생략)"});
  return out;
}

function parseDescBlocks(src){
  const lines=String(src||"").replace(/\r\n/g,"\n").split("\n");
  const blocks=[]; let buf=[];
  const flush=()=>{ if(buf.length){ blocks.push({type:"text", text:buf.join("\n")}); buf=[]; } };
  for(const line of lines){
    const m=line.match(/^\[\[파일:(\d+)((?:\|[^\]]*)*)\]\]\s*$/);
    if(m){
      flush();
      const idx=+m[1];
      const parts=(m[2]||"").split("|").map(s=>s.trim()).filter(Boolean);
      let caption="", width=100, ratio="auto";
      parts.forEach(p=>{
        const wm=p.match(/^w(?:idth)?\s*=\s*(\d{1,3})%?$/i);
        const rm=p.match(/^r(?:atio)?\s*=\s*([\d./]+|auto)$/i);
        if(wm) width=Math.min(100,Math.max(10,+wm[1]));
        else if(rm) ratio=rm[1];
        else if(!caption) caption=p;
      });
      blocks.push({type:"img", idx, caption, width, ratio});
    } else buf.push(line);
  }
  flush();
  if(!blocks.length) blocks.push({type:"text", text:""});
  return blocks;
}
function serializeDescBlocks(blocks){
  return (blocks||[]).map(b=>{
    if(b.type==="img"){
      const bits=["파일:"+b.idx];
      if(b.caption) bits.push(b.caption);
      bits.push("w="+Math.round(b.width||100));
      if(b.ratio && b.ratio!=="auto") bits.push("r="+b.ratio);
      return "[["+bits.join("|")+"]]";
    }
    return b.text||"";
  }).join("\n");
}

function renderWiki(src, bodyImages){
  const lines=(src||"").replace(/\r\n/g,"\n").split("\n"); const blocks=[]; let i=0;
  while(i<lines.length){
    const line=lines[i];
    const fileM=line.match(/^\[\[파일:(\d+)((?:\|[^\]]*)*)\]\]\s*$/);
    if(fileM){
      const idx=+fileM[1];
      const parts=(fileM[2]||"").split("|").map(s=>s.trim()).filter(Boolean);
      let cap="", width=100, ratio="";
      parts.forEach(p=>{
        const wm=p.match(/^w(?:idth)?\s*=\s*(\d{1,3})%?$/i);
        const rm=p.match(/^r(?:atio)?\s*=\s*([\d./]+|auto)$/i);
        if(wm) width=Math.min(100,Math.max(10,+wm[1]));
        else if(rm) ratio=rm[1]==="auto"?"":rm[1];
        else if(!cap) cap=p;
      });
      if(!cap) cap=(bodyImages?.[idx]?.caption||"").trim();
      const img=bodyImages?.[idx];
      if(img?.url){
        const ar=ratio && ratio.includes("/") ? ratio.replace("/"," / ") : "";
        const st=`width:${width}%;max-width:100%;${ar?`aspect-ratio:${ar};`:""}object-fit:cover;display:block;margin:0 auto`;
        blocks.push(`<figure style="margin:1rem auto;width:${width}%;max-width:100%"><img src="${esc(img.url)}" style="${st}"/><figcaption class="muted" style="font-size:.8rem;text-align:center">${esc(cap)}</figcaption></figure>`);
      }
      i++; continue;
    }
    if(/^={2,6}\s*.+\s*={2,6}\s*$/.test(line)){ const m=line.match(/^(={2,6})\s*(.+?)\s*\1\s*$/); if(m){ const lv=Math.min(m[1].length,3); blocks.push(`<h${lv}>${inline(m[2])}</h${lv}>`); i++; continue; } }
    if(/^----+\s*$/.test(line)){ blocks.push("<hr/>"); i++; continue; }
    if(/^\*\s+/.test(line)){ const items=[]; while(i<lines.length&&/^\*\s+/.test(lines[i])){ items.push(`<li>${inline(lines[i].replace(/^\*\s+/,""))}</li>`); i++; } blocks.push(`<ul>${items.join("")}</ul>`); continue; }
    if(line.trim()===""){ i++; continue; }
    const paras=[line]; i++; while(i<lines.length&&lines[i].trim()!==""&&!/^(={2,6}|----+|\*\s|\[\[파일:)/.test(lines[i])){ paras.push(lines[i]); i++; }
    blocks.push(`<p>${inline(paras.join("\n"))}</p>`);
  }
  return blocks.join("")||"<p class=\"muted\">본문 없음</p>";
}
function parseWikiSections(src){
  const lines=(src||"").replace(/\r\n/g,"\n").split("\n");
  const sections=[]; let cur={title:null,level:0,start:0,lines:[]};
  const flush=()=>{ if(cur.lines.length||cur.title!==null) sections.push({...cur, lines:[...cur.lines]}); };
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    const m=line.match(/^(={2,6})\s*(.+?)\s*\1\s*$/);
    if(m){ flush(); cur={title:m[2],level:Math.min(m[1].length,3),start:i,lines:[]}; }
    else cur.lines.push(line);
  }
  flush();
  return sections;
}

    tools.appendChild(foldBtn); tools.appendChild(editBtn); head.appendChild(tools);
    block.appendChild(head);

  });
  wrap.querySelectorAll("a.wiki-link[data-id]").forEach(a=>{

  });
  return wrap;
}
function inline(text){
  let s=esc(text);
  const B="'''"; s=s.split(B).map((p,i)=>i%2?('<strong>'+p+'</strong>'):p).join('');
  const I="''"; /* after bold */
  s=s.replace(/\[\[([^\]|#]+)(?:\|([^\]]+))?\]\]/g,(_,t,l)=>{ if(/^파일:/i.test(t)) return esc("[["+t+"]]"); const hit=findBySci(t.trim()); const d=l?esc(l):esc(t.trim()); return hit?`<a class="wiki-link" data-id="${esc(hit.id)}">${d}</a>`:`<span style="color:var(--danger)">${d}</span>`; });
  return s;
}

async function seedIfEmpty(existing){
  if(Object.keys(existing).length>0) return existing;
  const seed=buildSeedTaxa();
  const rows=Object.values(seed).map(taxonToRow);
  try{
    for(let i=0;i<rows.length;i+=40){
      const chunk=rows.slice(i,i+40);
      const {error}=await sb.from("taxa").upsert(chunk);
      if(error) console.warn("seed chunk",error);
    }
    toast("초기 분류군 시드 완료");
  }catch(e){ console.warn(e); }
  return seed;
}

async function ensureTaxonBody(id, force){
  const t=S.taxa[id];
  if(!t) return null;
  if(!force && t._bodyLoaded) return t;
  try{
    let res=await sb.from("taxa").select("id,rank,parent_id,scientific_name,korean_name,authority,description,profile_image_url,profile_image_caption,profile_image_license,body_images,catalog_no,is_extinct,is_fossil,in_ornamental").eq("id",id).maybeSingle();
    if(res.error && /column/i.test(res.error.message||"")){
      res=await sb.from("taxa").select("id,rank,parent_id,scientific_name,korean_name,authority,description,profile_image_url,profile_image_caption,body_images,catalog_no").eq("id",id).maybeSingle();
    }
    if(res.error) throw res.error;
    if(!res.data){ t._bodyLoaded=true; return t; }
    const full=rowToTaxon(res.data);
    const hasCol=Object.prototype.hasOwnProperty.call(res.data,"in_ornamental");
    const next={...t,...full,_bodyLoaded:true};
    if(!hasCol) next.inOrnamental=!!t.inOrnamental;
    S.taxa={...S.taxa,[id]:next};
    return next;
  }catch(e){
    console.warn("ensureTaxonBody", e);
    t._bodyLoaded=true;
    return t;
  }
}

async function refreshSession(){
  const {data:{session}}=await sb.auth.getSession(); S.session=session;
  if(session?.user){
    let {data}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
    const email=session.user.email||"";
    const dn=(data?.display_name)||email.split("@")[0]||"user";
    if(!data){
      data={id:session.user.id,email,display_name:dn,avatar_url:defaultAvatar(session.user.id,dn),role:email.toLowerCase()===ADMIN_EMAIL?"admin":"user",contribution_count:0};
      await sb.from("profiles").upsert(data);
    } else if(isPlaceholderAvatar(data.avatar_url)){
      // DiceBear 등 옛 기본값은 화면만 게 아이콘으로 (DB는 프로필 저장 시 교체)
      data={...data, avatar_url:defaultAvatar(data.id||email, dn)};
    }
    S.profile=ensureAvatar(data);
    // 로컬 백업 아바타: DB가 비었거나 플레이스홀더이거나, 백업이 더 최신 로컬 사진일 때
    try{
      const bak=localStorage.getItem("bw_av_"+session.user.id);
      if(bak && bak.startsWith("data:image")){
        const cur=String(S.profile.avatar_url||"");
        if(isPlaceholderAvatar(cur) || !cur || (cur.startsWith("data:image") && bak.length!==cur.length)){
          // 길이가 다르면 새 사진으로 간주
          if(isPlaceholderAvatar(cur) || !cur || bak!==cur) S.profile={...S.profile, avatar_url:bak};
        }
      }
    }catch(e){}
  } else S.profile=null;
}

function isOrnamentalExcludedLineage(t){
  const blocked=new Set(["hymenosomatoidea","hymenosomatidae","pinnotheroidea","pinnotheridae","cryptochiroidea","cryptochiridae"]);
  let cur=t, g=0, seen=new Set();
  while(cur && g++<24 && !seen.has(cur.id)){
    seen.add(cur.id);
    const n=String(cur.scientificName||"").replace(/^†\s*/,"").toLowerCase();
    if(blocked.has(n)) return true;
    cur=cur.parentId?S.taxa[cur.parentId]:null;
  }
  return false;
}
function isHymenoLineage(t){ return isOrnamentalExcludedLineage(t); }
function isThoracoLineage(t){
  if(!t) return false;
  if(isOrnamentalExcludedLineage(t)) return false;
  const cl=cladeOf(t);
  const cn=String((cl&&cl.scientificName)||"").toLowerCase();
  if(cn.includes("thoracotrem") || cn.includes("true freshwater") || cn.includes("freshwater crab")) return true;
  let cur=t, g=0, seen=new Set();
  const supers=["grapsoidea","ocypodoidea","potamoidea","gecarcinucoidea","pseudothelphusoidea","trichodactyloidea"];
  while(cur && g++<24 && !seen.has(cur.id)){
    seen.add(cur.id);
    const n=String(cur.scientificName||"").replace(/^†\s*/,"").toLowerCase();
    if(n.includes("thoracotrem") || n.includes("true freshwater")) return true;
    if(supers.includes(n)) return true;
    cur=cur.parentId?S.taxa[cur.parentId]:null;
  }
  return false;
}
function isCoenobitidaeLineage(t){
  let cur=t, g=0, seen=new Set();
  while(cur && g++<24 && !seen.has(cur.id)){
    seen.add(cur.id);
    if(String(cur.scientificName||"").replace(/^†\s*/,"").toLowerCase()==="coenobitidae") return true;
    cur=cur.parentId && S.taxa ? S.taxa[cur.parentId] : null;
  }
  return false;
}
function defaultOrnamentalFlag(t){
  if(isCoenobitidaeLineage(t)) return true;
  if(typeof SITE_KIND!=="undefined" && SITE_KIND==="ornamental") return true;
  return !!(t && isThoracoLineage(t) && !isOrnamentalExcludedLineage(t));
}
function ancestorOfRank(t, rank){
  let cur=t, g=0, seen=new Set();
  while(cur && g++<24 && !seen.has(cur.id)){
    seen.add(cur.id);
    if(cur.rank===rank) return cur;
    cur=cur.parentId?S.taxa[cur.parentId]:null;
  }
  return null;
}

async function saveTaxon(taxon,summary){
  if(taxon && taxon.rank==="species" && taxon.parentId && isCheraxGenus(S.taxa[taxon.parentId])){
    throw new Error("Cherax 본 속에는 종을 직접 추가할 수 없습니다. 북부·동부·남서부 Cherax를 고르세요.");
  }
  if(!canWriteDocs()) throw new Error(editLockLabel()||"현재 수정이 잠겨 있습니다");
  const auth=await assertCanEdit();
  if(!canEditTaxon(taxon) && !S.taxa[taxon.id]){
    // 신규 추가
    if(!canAddRank(taxon.rank)) throw new Error("이 계급은 관리자만 추가할 수 있습니다");
  } else if(S.taxa[taxon.id] && !canEditTaxon(taxon)){
    throw new Error("이 계급 문서는 관리자만 수정할 수 있습니다");
  }
  if(typeof SITE_KIND!=="undefined" && SITE_KIND==="ornamental"){
    if(!S.taxa[taxon.id]) taxon.inOrnamental=true;
  } else if(taxon.inOrnamental==null || isCoenobitidaeLineage(taxon)){
    if(isCoenobitidaeLineage(taxon)) taxon.inOrnamental=true;
    else if(taxon.inOrnamental==null) taxon.inOrnamental=defaultOrnamentalFlag(taxon);
  }
  if(containsBanned(taxon.description)||containsBanned(summary)) throw new Error("금지어 포함");
  let row=taxonToRow(taxon);
  let {error}=await sb.from("taxa").upsert(row);
  if(error && /profile_image_license|column/i.test(error.message||"")){
    delete row.profile_image_license;
    ({error}=await sb.from("taxa").upsert(row));
  }
  if(error && /in_ornamental|column/i.test(error.message||"")){
    delete row.in_ornamental;
    ({error}=await sb.from("taxa").upsert(row));
  }
  if(error && /is_extinct|is_fossil|column/i.test(error.message||"")){
    delete row.is_extinct;
    delete row.is_fossil;
    ({error}=await sb.from("taxa").upsert(row));
  }
  if(error) throw error;
  const snap=JSON.stringify(taxon);
  const rev={id:`rev-${Date.now()}`,taxon_id:taxon.id,at:new Date().toISOString(),summary:summary||"수정",editor_user_id:S.session?.user?.id||null,editor_name:isLogged()?displayName():"게스트",editor_ip:auth.ip||"",snapshot:snap};
  let rerr=(await sb.from("revisions").upsert(rev)).error;
  if(rerr && /snapshot|column/i.test(rerr.message||"")){
    console.warn("revisions snapshot column?", rerr.message);

    rerr=(await sb.from("revisions").upsert(revNoSnap)).error;
  }
  if(rerr){ console.warn("revision save failed", rerr); try{ toast("역사 저장 실패: "+rerr.message); }catch(e){} }
  else {
    try{
      if(!S.revisions) S.revisions=[];

        id:rev.id, taxonId:taxon.id, at:Date.now(), summary:rev.summary,
        editorName:rev.editor_name, editorIp:rev.editor_ip, editorUserId:rev.editor_user_id,
        snapshot:rev.snapshot, charsAdded:0, charsRemoved:0
      });

  }
  try{ await sb.from("notifications").insert({audience:"admin",kind:"edit",title:`[실시간] ${taxon.scientificName}`,body:`${rev.editor_name} · ${summary||""}`,meta:{taxon_id:taxon.id}}); }catch{}
  if(isLogged()) await bumpContribution();

  S.revisions=[{id:rev.id,taxonId:taxon.id,at:Date.now(),summary:rev.summary,editorName:rev.editor_name,editorIp:rev.editor_ip,editorUserId:rev.editor_user_id,snapshot:snap},...S.revisions].slice(0,200);
  await loadRankings();
  try{ playOpenRitual(); }catch(e){}
  try{ ensureBgmPlaying(); }catch(e){}
}

function sfxAC(){
  if(!_ac){ _ac=new (window.AudioContext||window.webkitAudioContext)(); }
  if(_ac.state==="suspended") _ac.resume();
  return _ac;
}
function sfxTone(freq, dur, type, gain, when, slideTo){
  if(_sfxMuted) return;
  try{
    const ac=sfxAC(); const t=when||ac.currentTime;
    const o=ac.createOscillator(); const g=ac.createGain();
    const f=ac.createBiquadFilter();
    o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40,slideTo), t+dur);
    f.type="lowpass"; f.frequency.setValueAtTime(2200,t); f.Q.value=0.7;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(gain||0.08, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(f); f.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function sfxNoise(dur, gain){
  if(_sfxMuted) return;
  try{
    const ac=sfxAC(); const t=ac.currentTime;
    const n=Math.floor(ac.sampleRate*dur);
    const buf=ac.createBuffer(1,n,ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
    const src=ac.createBufferSource(); src.buffer=buf;
    const f=ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1800; f.Q.value=0.6;
    const g=ac.createGain(); g.gain.value=gain||0.04;
    src.connect(f); f.connect(g); g.connect(ac.destination);
    src.start(t);
  }catch(e){}
}
function sfx(kind){
  if(_sfxMuted) return;
  const ac=sfxAC(); const t=ac.currentTime;
  switch(kind){
    case "click": // soft glass tick
      sfxTone(880,0.07,"sine",0.05,t,1320);
      sfxTone(1760,0.05,"triangle",0.025,t+0.01);
      break;
    case "tap":
      sfxTone(660,0.06,"sine",0.04,t,990);
      break;
    case "nav": // dreamy whoosh
      sfxNoise(0.18,0.03);
      sfxTone(320,0.22,"sine",0.045,t,520);
      sfxTone(480,0.28,"triangle",0.03,t+0.02,280);
      break;
    case "slide": // airy arpeggio
      sfxTone(523.25,0.18,"sine",0.05,t);
      sfxTone(659.25,0.2,"sine",0.04,t+0.07);
      sfxTone(783.99,0.28,"triangle",0.035,t+0.14);
      sfxNoise(0.12,0.02);
      break;
    case "open":
      sfxTone(392,0.2,"sine",0.05,t,587);
      sfxTone(784,0.25,"triangle",0.03,t+0.05);
      break;
    case "close":
      sfxTone(587,0.15,"sine",0.04,t,349);
      sfxTone(440,0.18,"triangle",0.025,t+0.04,220);
      break;
    case "success":
      sfxTone(523,0.12,"sine",0.05,t);
      sfxTone(659,0.14,"sine",0.045,t+0.09);
      sfxTone(784,0.22,"triangle",0.04,t+0.18);
      break;
    case "error":
      sfxTone(220,0.2,"triangle",0.05,t,180);
      sfxTone(165,0.25,"sine",0.04,t+0.08);
      break;
    case "toggle":
      sfxTone(700,0.08,"sine",0.04,t,900);
      sfxTone(900,0.1,"triangle",0.03,t+0.05,700);
      break;
    case "notify":
      sfxTone(880,0.12,"sine",0.045,t);
      sfxTone(1174,0.2,"sine",0.04,t+0.1);
      break;
    case "fold":
      sfxTone(500,0.1,"sine",0.035,t,350);
      break;
    default:
      sfxTone(700,0.08,"sine",0.04,t);
  }
}

let _openAudio=null;
function playOpenRitual(opts){
  opts=opts||{};
  // 사운드: 끊지 않고 자연 재생 (효과음 ON일 때)
  if(!_sfxMuted){
    try{
      if(!_openAudio){
        _openAudio=new Audio(OPEN_SFX_DATA);
        _openAudio.preload="auto";
        _openAudio.volume=0.52;
      }
      clearTimeout(_openAudio._stopT);
      _openAudio.currentTime=0;
      const p=_openAudio.play();
      if(p&&p.catch) p.catch(()=>{});
    }catch(e){ console.warn("open sfx", e); }
  }
  try{
    const mk=(id)=>{
      let el=document.getElementById(id);
      if(!el){
        el=document.createElement("div");
        el.id=id;
        el.setAttribute("aria-hidden","true");
        document.body.appendChild(el);
      }
      return el;
    };
    const dim=mk("open-dim");
    const el=mk("open-backlight");
    const rays=mk("open-rays");
    // 동그라미 링 제거 · z-index는 배경 레이어만 (UI 위 덮지 않음)
    try{ const oldR=document.getElementById("open-ring"); if(oldR) oldR.remove(); }catch(e){}
    [dim,el,rays].forEach(n=>{ n.classList.remove("on"); });
    void dim.offsetWidth;
    [dim,el,rays].forEach(n=>{ n.classList.add("on"); });
    clearTimeout(el._t);
    el._t=setTimeout(()=>{
      try{ [dim,el,rays].forEach(n=>n.classList.remove("on")); }catch(e){}
    }, 2600);
  }catch(e){}
}

function sfxArm(){
  if(_sfxReady) return;
  _sfxReady=true;
  const unlock=()=>{ try{ sfxAC(); }catch(e){} document.removeEventListener("pointerdown",unlock); document.removeEventListener("keydown",unlock); };
  document.addEventListener("pointerdown",unlock,{once:true});
  document.addEventListener("keydown",unlock,{once:true});
  document.addEventListener("click",e=>{
    const t=e.target.closest("button, .seg, .tree-item, .sf-card, .sp-cell, .phylo-sf, .phylo-clade, .theater-thumb, .list-btn, a.wiki-link");
    if(!t) return;
    if(t.classList.contains("seg")||t.classList.contains("sf-card")||t.closest(".theater-nav")) sfx("nav");
    else if(t.classList.contains("theater-thumb")) sfx("slide");
    else if(t.classList.contains("phylo-sf")||t.classList.contains("phylo-clade")) sfx("tap");
    else sfx("click");
  }, true);
}

/** 브라우저 뒤로가기 → 앱 내 이전 화면 (사이트 이탈 방지) */
let _histQuiet=false;
function appStateSnapshot(){
  return {
    segment:S.segment||"home",
    view:S.view?{...S.view}:null,
    modal:S.modal?{...S.modal}:null,
    notifOpen:!!S.notifOpen,
    chatMode:S.chatMode||"public",
    slideFs:!!S.slideFs,
    speciesPage:S.speciesPage||0,
    scroll: getScrollY()
  };
}
function applyAppState(st){
  if(!st) return;
  S.segment=st.segment||"home";
  S.view=st.view||null;
  S.modal=st.modal||null;
  S.notifOpen=!!st.notifOpen;
  if(st.chatMode) S.chatMode=st.chatMode;
  S.slideFs=!!st.slideFs;
  if(typeof st.speciesPage==="number") S.speciesPage=st.speciesPage;
  if(st.scroll) S._restoreScroll=st.scroll;
}
function stateToHash(st){
  try{
    const seg=st.segment||"home";
    let h="#/"+encodeURIComponent(seg);
    if(st.view&&st.view.id) h+="/"+encodeURIComponent(st.view.id);
    return h;
  }catch(e){ return "#/home"; }
}
function parseHashToState(){
  try{
    const raw=(location.hash||"").replace(/^#\/?/,"");
    if(!raw) return null;
    const parts=raw.split("/").filter(Boolean).map(p=>{ try{return decodeURIComponent(p);}catch(e){return p;}});
    const segment=parts[0]||"home";
    const allowed=["home","taxonomy","slides","chat","rankings","options"];
    const seg=allowed.includes(segment)?segment:"home";
    const view=parts[1]?{kind:"taxon",id:parts[1]}:null;
    return {segment:seg, view, modal:null, notifOpen:false, slideFs:false};
  }catch(e){ return null; }
}
function pushAppState(replace){
  if(_histQuiet) return;
  try{
    // 떠나기 전 현재 항목에 스크롤 저장 (뒤로가기 복원용)
    if(!replace && history.state){
      try{
        const cur={...history.state, scroll:getScrollY()};
        history.replaceState(cur,"",location.href);
      }catch(e){}
    }
    const st=appStateSnapshot();
    const url=stateToHash(st);
    if(replace) history.replaceState(st,"",url);
    else {
      // 같은 URL이면 replace만 (히스토리 폭증 방지)
      if(location.hash===url || location.hash===url.replace(/^#/,"#")){
        history.replaceState(st,"",url);
      } else {
        history.pushState(st,"",url);
      }
    }
  }catch(e){ console.warn("pushAppState",e); }
}
function navTo(patch){

let _renderTimer=null;

function applyChromeHidden(){
  const ch=document.getElementById("site-chrome");
  if(ch) ch.classList.toggle("chrome-hide", !!S.chromeHidden);
}
function setupChromeScroll(){
  if(_chromeBound) return;
  _chromeBound=true;
  let lastY=0, acc=0, ticking=false;
  const readY=()=>{
    const main=document.querySelector(".main");
    return Math.max(window.scrollY||0, document.documentElement.scrollTop||0, document.body.scrollTop||0, main?main.scrollTop:0);
  };
  const commit=()=>{
    ticking=false;
    const y=readY();
    const dy=y-lastY;
    lastY=y;
    if(y<48){ if(S.chromeHidden){ S.chromeHidden=false; } acc=0; return; }
    acc+=dy;
    if(acc>28 && !S.chromeHidden){ S.chromeHidden=true; acc=0; applyChromeHidden(); }
    else if(acc<-28 && S.chromeHidden){ S.chromeHidden=false; acc=0; applyChromeHidden(); }
  };
  const onScroll=()=>{ if(ticking) return; ticking=true; requestAnimationFrame(commit); };
  window.addEventListener("scroll", onScroll, {passive:true});
  document.addEventListener("scroll", onScroll, {capture:true, passive:true});
}
function scheduleRender(ms){
  clearTimeout(_renderTimer);
  _renderTimer=setTimeout(()=>{ _renderTimer=null; render(true); }, ms||48);
}

let _sfCar={timer:null,raf:null,idle:null,speed:0,target:0.45,paused:false};
function startSfCarousel(rail, count){
  try{
    if(_sfCar.raf) cancelAnimationFrame(_sfCar.raf);
    clearTimeout(_sfCar.idle);
    _sfCar.speed=0; _sfCar.paused=false;
    if(!rail || count<3) return;
    // 모든 카드가 한 화면에 보이면 캐러셀 불필요
    if(rail.scrollWidth <= rail.clientWidth + 8) return;
    // 과도하게 넓은 화면(축소 등)에서도 스크롤 여지가 거의 없으면 중단
    if(rail.clientWidth > 1100 && rail.scrollWidth < rail.clientWidth * 1.15) return;
    rail.classList.add("carousel-on");
    const tick=()=>{
      if(!_sfCar.paused && document.body.contains(rail)){
        // 가속/감속
        _sfCar.speed += (_sfCar.target - _sfCar.speed) * 0.04;
        if(_sfCar.speed > 0.02){
          rail.scrollLeft += _sfCar.speed;
          if(rail.scrollLeft + rail.clientWidth >= rail.scrollWidth - 2){
            rail.scrollLeft = 0;
          }
        }
      }
      _sfCar.raf=requestAnimationFrame(tick);
    };
    const pause=()=>{
      _sfCar.paused=true; _sfCar.speed=0; _sfCar.target=0;
      clearTimeout(_sfCar.idle);
      _sfCar.idle=setTimeout(()=>{
        _sfCar.paused=false;
        _sfCar.target=0.15; // 점진적
        setTimeout(()=>{ if(!_sfCar.paused) _sfCar.target=0.45; }, 1200);
      }, 4000);
    };
    ["pointerdown","touchstart","wheel"].forEach(ev=>rail.addEventListener(ev, pause, {passive:true}));
    // 시작은 살짝 딜레이 후 가속
    setTimeout(()=>{ if(!_sfCar.paused){ _sfCar.target=0.45; } }, 600);
    _sfCar.raf=requestAnimationFrame(tick);
  }catch(e){ console.warn(e); }
}

function viewHome(){
  const w=el(`<div></div>`);
  if(!isLogged()) w.appendChild(el(`<div class="panel" style="margin-bottom:1rem"><strong class="gold">알림</strong><p class="muted" style="margin:.35rem 0 0">로그인해주세요.</p></div>`));
  const photos=homeSlidePhotos(); const hero=el(`<div class="hero"></div>`);
  if(photos.length){ const p=photos[S.slide%photos.length]; const lic=(p.profileImageLicense||"").trim();
    hero.innerHTML=`<img src="${esc(p.profileImageUrl)}" alt=""/><div class="cap"><em>${esc(displaySciName(p))}</em><div class="muted">${esc(p.koreanName)}</div>${lic?`<div class="hero-lic">© ${esc(lic)}</div>`:""}</div>`;
    hero.onclick=()=>{jiggleEl(hero); setTimeout(()=>{S.segment="taxonomy";S.view={kind:"taxon",id:p.id};render();},220);}; }
  else hero.innerHTML=`<div class="empty">프로필 이미지 없음</div>`;
  w.appendChild(hero);
  // 홈 메인 슬라이드 자동 넘김
  try{ clearInterval(S.homeSlideTimer); }catch(e){}
  if(photos.length>1){
    S.homeSlideTimer=setInterval(()=>{
      if(S.segment!=="home" || S.modal || S.notifOpen) return;
      const list=homeSlidePhotos();
      if(list.length<2) return;
      S.slide=(S.slide+1)%list.length;
      const p=list[S.slide];
      const heroEl=document.querySelector(".main .hero")||document.querySelector(".hero");
      if(!heroEl||!p) return;
      const lic=(p.profileImageLicense||"").trim();
      heroEl.innerHTML=`<img src="${esc(p.profileImageUrl)}" alt=""/><div class="cap"><em>${esc(displaySciName(p))}</em><div class="muted">${esc(p.koreanName)}</div>${lic?`<div class="hero-lic">© ${esc(lic)}</div>`:""}</div>`;
      heroEl.onclick=()=>{ try{jiggleEl(heroEl);}catch(e){} setTimeout(()=>{S.segment="taxonomy";S.view={kind:"taxon",id:p.id};render();},220);};
      try{ sfx("slide"); }catch(e){}
    }, S.slideMs||4500);
  }

  w.appendChild(el(`<div style="margin:1rem 0 .4rem;display:flex;justify-content:space-between"><div><div class="side-title">관상용 가재 도감 분류</div><h2 class="gold-text" style="margin:0">민물가재</h2></div><span class="muted">${ORN_HOME.length}</span></div>`));
  const filters=el(`<div class="sf-filters" role="tablist"></div>`);
  const filterOpts=[["all","전체"], ...ORN_HOME.map(c=>[c.id,c.label])];
  filterOpts.forEach(([id,lab])=>{
    const on=(S.sfCladeFilter||"all")===id;
    const b=el(`<button type="button" class="sf-filter ${on?"on":""}" title="${esc(lab)}">${esc(lab)}</button>`);
    b.onclick=()=>{ try{sfx("tap")}catch(e){} S.sfCladeFilter=id; S.speciesPage=0; S._spOrder=null; S._scrollToSpecies=true; render(); };
    filters.appendChild(b);
  });
  w.appendChild(filters);
  const rail=el(`<div class="sf-rail"></div>`);
  let list=[];
  const ornF=S.sfCladeFilter||"all";
  if(ornF==="all"){
    list=ORN_HOME.map(c=>({id:"orn-"+c.id, rank:"orn", scientificName:c.label, koreanName:c.sub, catalogNo:null, _orn:c.id}));
  } else {
    list=ornUnits(ornF).map(u=>({...u, _orn:ornF}));
  }
  list.forEach((sf,idx)=>{
    const img=sf.rank==="orn"?"":repImg(sf);
    const media=img?`<img class="thumb" src="${esc(img)}" alt=""/>`:`<img class="wm" src="${ASSET_CRAB}" alt=""/>`;
    const b=el(`<button type="button" class="sf-card"><div class="sf-body"><div class="num">${String(sf.catalogNo??idx+1).toString().padStart(2,"0")}</div><div class="sci gold-text">${esc(sf.rank==="orn"?sf.scientificName:displaySciName(sf))}</div><div class="ko">${esc(sf.koreanName||"")}</div></div><div class="sf-media${img?"":" empty"}">${media}</div></button>`);
    b.onclick=()=>{
      try{sfx("tap")}catch(e){}
      if(sf.rank==="orn"){ S.sfCladeFilter=sf._orn; S.speciesPage=0; render(); return; }
      S.segment="taxonomy";S.view={kind:"taxon",id:sf.id};render();
    };
    rail.appendChild(b);
  });
  if(!list.length) rail.appendChild(el(`<div class="empty" style="padding:.5rem 0">해당 분류 단위 없음</div>`));
  w.appendChild(rail);
  // 상과 캐러셀: 손이 닿으면 멈춤, 4초 후 서서히 재개. 폭이 충분하면 자동 안 함.
  requestAnimationFrame(()=>startSfCarousel(rail, list.length));


  // 상과 필터와 연동된 하위 탭: 생물 목록 (같은 절 필터 적용)
  const cladeF=S.sfCladeFilter||"all";
  const photoList=speciesPhotos().filter(t=>crayInCat(t, cladeF));
  const orderKey="spOrd:"+cladeF;
  if(!S._spOrderMap) S._spOrderMap={};
  if(!S._spOrderMap[orderKey] || S._spOrderMap[orderKey].length!==photoList.length){
    const ids=photoList.map(x=>x.id);
    for(let i=ids.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=ids[i]; ids[i]=ids[j]; ids[j]=t; }
    S._spOrderMap[orderKey]=ids;
  }
  const ordered=S._spOrderMap[orderKey].map(id=>S.taxa[id]).filter(t=>t&&t.profileImageUrl&&crayInCat(t, cladeF));
  const per=32;
  const pages=Math.max(1, Math.ceil((ordered.length||1)/per));
  if(S.speciesPage>=pages) S.speciesPage=pages-1;
  if(S.speciesPage<0) S.speciesPage=0;
  const slice=ordered.slice(S.speciesPage*per, S.speciesPage*per+per);
  const filterLab=cladeF==="all"?"전체":((ORN_HOME.find(c=>c.id===cladeF)||{}).label||cladeF);

  const bioHead=el(`<div id="home-species" style="margin:1.15rem 0 .45rem;display:flex;justify-content:space-between;align-items:end;gap:.5rem;flex-wrap:wrap">
    <div>
      <div class="side-title">Catalog · 상과 하위</div>
      <h2 class="gold-text" style="margin:0">생물 목록</h2>
      <p class="muted" style="margin:.25rem 0 0;font-size:.78rem">상단 필터와 동일 · <b style="color:var(--gold-soft)">${esc(filterLab)}</b></p>
    </div>
    <span class="muted">${ordered.length}종</span>
  </div>`);
  w.appendChild(bioHead);
  const grid=el(`<div class="sp-grid"></div>`);
  if(!slice.length) grid.appendChild(el(`<div class="empty" style="grid-column:1/-1">프로필 이미지가 있는 종이 없습니다</div>`));
  slice.forEach(sp=>{
    const lic=(sp.profileImageLicense||"").trim();
    const cap=(sp.profileImageCaption||"").trim();
    const under=lic?("© "+lic):(cap?cap:"");
    const cell=el(`<button type="button" class="sp-cell"><div class="sp-cell-img"><img src="${esc(sp.profileImageUrl)}" alt="" loading="lazy" decoding="async"/></div><div class="sp-cell-name">${esc(displaySciName(sp))}</div>${under?`<div class="sp-cell-lic">${esc(under)}</div>`:`<div class="sp-cell-lic" style="opacity:.4">라이선스 미입력</div>`}</button>`);
    cell.onclick=()=>{S.segment="taxonomy";S.view={kind:"taxon",id:sp.id};render();};
    grid.appendChild(cell);
  });
  w.appendChild(grid);
  const pager=el(`<div class="sp-pager"></div>`);
  const prev=el(`<button type="button" class="btn btn-line">이전</button>`);
  prev.disabled=S.speciesPage<=0;
  prev.onclick=()=>{ if(S.speciesPage>0){ S.speciesPage--; S._scrollToSpecies=true; render(); } };
  const info=el(`<span class="muted">${ordered.length? (S.speciesPage+1)+" / "+pages : "0"}</span>`);
  const next=el(`<button type="button" class="btn btn-line">다음</button>`);
  next.disabled=S.speciesPage>=pages-1 || !ordered.length;
  next.onclick=()=>{ if(S.speciesPage<pages-1){ S.speciesPage++; S._scrollToSpecies=true; render(); } };
  pager.appendChild(prev); pager.appendChild(info); pager.appendChild(next);
  w.appendChild(pager);
  return w;
}
function viewTaxHub(){
  const w=el(`<div></div>`);
  w.appendChild(el(`<div class="panel"><div class="side-title">Phylogeny</div><h1 style="font-style:normal">계통분류</h1><p class="muted" style="margin:.4rem 0 0;font-size:.9rem">민물성 가재류들만 표기합니다</p></div>`));
  const tree=el(`<div class="phylo panel" style="margin-top:.85rem"></div>`);
  const supers=Object.values(S.taxa||{}).filter(x=>x && x.rank==="superfamily" && (String(x.scientificName)==="Astacoidea" || String(x.scientificName)==="Parastacoidea"))
    .sort((a,b)=>a.scientificName.localeCompare(b.scientificName));
  supers.forEach(sf=>{
    const node=el(`<div class="phylo-node"></div>`);
    const head=el(`<button type="button" class="phylo-clade"><span class="phylo-dot"></span><span class="phylo-name gold-text">${esc(sf.scientificName)}</span><span class="muted">상과 · ${esc(sf.koreanName||"")}</span></button>`);
    head.onclick=()=>{S.view={kind:"taxon",id:sf.id};render();};
    node.appendChild(head);
    const list=el(`<div class="phylo-sf-list"></div>`);
    const fams=childrenOf(sf.id).filter(x=>x.rank==="family").sort((a,b)=>_sciName(a).localeCompare(_sciName(b)));
    if(!fams.length) list.appendChild(el(`<div class="muted" style="font-size:.8rem;padding:.25rem .5rem">과 없음</div>`));
    fams.forEach((fa,i)=>{
      const row=el(`<button type="button" class="phylo-sf"><span class="phylo-rail"></span><span class="phylo-idx">${String(i+1).padStart(2,"0")}</span><span class="phylo-sf-sci">${esc(displaySciName(fa))}</span><span class="muted phylo-sf-ko">${esc("과 · "+(fa.koreanName||""))}</span></button>`);
      row.onclick=()=>{S.view={kind:"taxon",id:fa.id};render();};
      list.appendChild(row);
      childrenOf(fa.id).filter(x=>x.rank==="genus").sort((a,b)=>_sciName(a).localeCompare(_sciName(b))).forEach((g,j)=>{
        const gr=el(`<button type="button" class="phylo-sf" style="padding-left:1.4rem"><span class="phylo-rail"></span><span class="phylo-idx">${String(j+1).padStart(2,"0")}</span><span class="phylo-sf-sci">${esc(displaySciName(g))}</span><span class="muted phylo-sf-ko">${esc("속 · "+(g.koreanName||""))}</span></button>`);
        gr.onclick=()=>{S.view={kind:"taxon",id:g.id};render();};
        list.appendChild(gr);
      });
    });
    node.appendChild(list);
    tree.appendChild(node);
  });
  if(!supers.length) tree.appendChild(el(`<div class="empty">Astacoidea · Parastacoidea 상과가 아직 없습니다. SQL을 먼저 실행하세요.</div>`));
  w.appendChild(tree);
  return w;
}
function lineageNameHtml(t){
  if(!t) return "";
  const ko=t.koreanName?`<span class="ko">${esc(t.koreanName)}</span>`:"";
  return `<span class="lin-name"><em>${esc(displaySciName(t))}</em>${ko}</span>`;
}

const GUIDE_CATS=[
  {id:"all",label:"전체"},
  {id:"pet-crab",label:"애완용 게 관련"},
  {id:"crab",label:"게 관련"},
  {id:"crayfish",label:"가재 관련"},
  {id:"shrimp",label:"새우 관련"},
  {id:"other",label:"기타 십각류 관련"}
];
const GUIDE_SORTS=[{id:"hot",label:"인기 순"},{id:"new",label:"최신순"}];
function guideCatLabel(id){ return (GUIDE_CATS.find(c=>c.id===id)||{}).label || id || "기타"; }
function guideIdNew(prefix){ return prefix+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function guideCanEdit(g){ return !!(g && isLogged() && (isAdmin() || g.author_id===S.session?.user?.id)); }
async function loadShareGuides(){
  S.guides=S.guides||[]; S.guideTaxa=S.guideTaxa||{}; S.guideLikes=S.guideLikes||{};
  try{
    const {data,error}=await sb.from("share_guides").select("*").order("updated_at",{ascending:false}).limit(300);
    if(error) throw error;
    S.guides=data||[];
    const {data:links}=await sb.from("share_guide_taxa").select("guide_id,taxon_id");
    const map={};
    (links||[]).forEach(r=>{ (map[r.taxon_id]=map[r.taxon_id]||[]).push(r.guide_id); });
    S.guideTaxa=map;
    S._guideLinks=links||[];
    S.guideLikes={};
    if(isLogged()){
      const {data:likes}=await sb.from("share_guide_likes").select("guide_id").eq("user_id", S.session.user.id);
      (likes||[]).forEach(r=>{ S.guideLikes[r.guide_id]=true; });
    }
    S._guideErr="";
  }catch(e){ console.warn("share guides", e); S._guideErr=e.message||String(e); }
}
function guidesForTaxon(id){
  const ids=new Set((S.guideTaxa&&S.guideTaxa[id])||[]);
  return (S.guides||[]).filter(g=>ids.has(g.id));
}
function sortedGuides(list){
  const sort=S.guideSort||"hot";
  const score=g=>(Number(g.likes)||0)*3+(Number(g.views)||0);
  return [...list].sort((a,b)=>{
    const ap=a.pinned?1:0, bp=b.pinned?1:0;
    if(ap!==bp) return bp-ap;
    if(sort==="new") return String(b.created_at||b.updated_at||"").localeCompare(String(a.created_at||a.updated_at||""));
    return score(b)-score(a) || String(b.updated_at||"").localeCompare(String(a.updated_at||""));
  });
}
function guideMeta(g){
  return `${g.pinned?"고정 · ":""}좋아요 ${Number(g.likes)||0} · 조회 ${Number(g.views)||0}`;
}
function foldSection(title, count, bodyEl){
  const shut=count>4;
  const box=el(`<div class="fold ${shut?"shut":""}"></div>`);
  const head=el(`<button type="button" class="fold-head"><span>${esc(title)}</span><span class="fold-mark">${shut?"펼치기":"접기"}</span></button>`);
  const body=el(`<div class="fold-body"></div>`);
  body.appendChild(bodyEl);
  head.onclick=()=>{
    box.classList.toggle("shut");
    const m=head.querySelector(".fold-mark");
    if(m) m.textContent=box.classList.contains("shut")?"펼치기":"접기";
  };
  box.appendChild(head); box.appendChild(body);
  return box;
}
function appendRelatedGuides(panel, taxon){
  if(!panel || !taxon) return;
  const guides=sortedGuides(guidesForTaxon(taxon.id));
  const box=el(`<div style="margin-top:1.15rem"></div>`);
  const gbody=el(`<div></div>`);
  if(!guides.length) gbody.appendChild(el(`<div class="empty">없음</div>`));
  else guides.forEach(g=>{
    const b=el(`<button type="button" class="list-btn"><span class="chip">${esc(guideCatLabel(g.category))}</span><em>${esc(g.title)}</em><span class="muted" style="margin-left:.35rem;font-size:.75rem">${esc(guideMeta(g))}</span></button>`);
    b.onclick=()=>{ S.segment="guides"; S.guideId=g.id; render(); };
    gbody.appendChild(b);
  });
  box.appendChild(foldSection("관련 공유 가이드", guides.length, gbody));
  panel.appendChild(box);
}
async function loadStars(){
  S.stars=S.stars||{};
  if(!isLogged()){ S.stars={}; return; }
  try{
    const {data,error}=await sb.from("taxon_stars").select("taxon_id").eq("user_id", S.session.user.id);
    if(error) throw error;
    S.stars={};
    (data||[]).forEach(r=>{ S.stars[r.taxon_id]=true; });
  }catch(e){ console.warn("stars", e); }
}
function isStarred(id){ return !!(S.stars&&S.stars[id]); }
async function toggleStar(taxon){
  if(!taxon) return;
  if(!isLogged()){ toast("찜은 로그인 후 가능합니다"); return; }
  try{
    if(isStarred(taxon.id)) await sb.from("taxon_stars").delete().eq("user_id", S.session.user.id).eq("taxon_id", taxon.id);
    else await sb.from("taxon_stars").insert({user_id:S.session.user.id, taxon_id:taxon.id});
    await loadStars(); render();
  }catch(e){ alert("찜 테이블이 필요합니다. SQL을 실행해 주세요."); }
}
function viewMyPage(){
  const w=el(`<div class="panel"></div>`);
  if(!isLogged()){ w.appendChild(el(`<h1 style="font-style:normal">마이페이지</h1><p>로그인 후 볼 수 있습니다.</p>`)); return w; }
  const tab=S.myTab||"posts";
  w.appendChild(el(`<div class="side-title">My</div><h1 style="font-style:normal;margin:.15rem 0 .7rem">마이페이지</h1>`));
  const bar=el(`<div class="tabs-mini" style="display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.8rem"></div>`);
  [["posts","내가 쓴 글"],["likes","하트한 글"],["stars","즐겨찾기"],["contrib","기여 내역"]].forEach(([id,lab])=>{
    const b=el(`<button type="button" class="btn ${tab===id?"btn-gold on":"btn-line"}" style="min-height:32px;font-size:.78rem">${lab}</button>`);
    b.onclick=()=>{ S.myTab=id; renderKeepScroll(); };
    bar.appendChild(b);
  });
  w.appendChild(bar);
  const uid=S.session.user.id;
  if(tab==="posts"){
    const list=(S.guides||[]).filter(g=>g.author_id===uid);
    if(!list.length) w.appendChild(el(`<div class="empty">작성한 가이드 없음</div>`));
    list.forEach(g=>{
      const b=el(`<button type="button" class="list-btn" style="width:100%;text-align:left"><em>${esc(g.title)}</em><span class="muted" style="display:block;font-size:.75rem;margin-top:.15rem">${esc(guideCatLabel(g.category))} · ♥ ${Number(g.likes)||0}</span></button>`);
      b.onclick=()=>{ S.segment="guides"; S.guideId=g.id; render(); };
      w.appendChild(b);
    });
  } else if(tab==="likes"){
    const list=(S.guides||[]).filter(g=>S.guideLikes&&S.guideLikes[g.id]);
    if(!list.length) w.appendChild(el(`<div class="empty">하트한 글 없음</div>`));
    list.forEach(g=>{
      const b=el(`<button type="button" class="list-btn" style="width:100%;text-align:left"><em>${esc(g.title)}</em><span class="muted" style="display:block;font-size:.75rem;margin-top:.15rem">♥ ${Number(g.likes)||0} · 조회 ${Number(g.views)||0}</span></button>`);
      b.onclick=()=>{ S.segment="guides"; S.guideId=g.id; render(); };
      w.appendChild(b);
    });
  } else if(tab==="stars"){
    const ids=Object.keys(S.stars||{});
    if(!ids.length) w.appendChild(el(`<div class="empty">즐겨찾기 없음</div>`));
    ids.forEach(id=>{
      const t=S.taxa&&S.taxa[id];
      const b=el(`<button type="button" class="list-btn" style="width:100%;text-align:left"><span class="chip">${esc(t?(RANK_LABEL[t.rank]||t.rank):"")}</span><em style="font-family:var(--serif)">${esc(t?displaySciName(t):id)}</em><span class="muted" style="margin-left:.35rem">${esc(t&&t.koreanName||"")}</span></button>`);
      b.onclick=()=>{ S.segment="taxonomy"; S.view={kind:"taxon",id}; render(); };
      w.appendChild(b);
    });
  } else {
    const mine=(S.revisions||[]).filter(r=>r.editorUserId===uid);
    if(!mine.length) w.appendChild(el(`<div class="empty">이번 기록에 기여 내역 없음</div>`));
    mine.slice(0,40).forEach(r=>{
      const t=S.taxa&&S.taxa[r.taxonId];
      const b=el(`<button type="button" class="list-btn" style="width:100%;text-align:left"><em>${esc(t?displaySciName(t):r.taxonId)}</em><span class="muted" style="display:block;font-size:.75rem;margin-top:.15rem">${esc(r.summary||"수정")} · ${r.at?new Date(r.at).toLocaleString("ko-KR"):""}</span></button>`);
      if(t) b.onclick=()=>{ S.segment="taxonomy"; S.view={kind:"taxon",id:r.taxonId}; render(); };
      w.appendChild(b);
    });
  }
  return w;
}
function guideBodyImages(g){
  let body=g&&g.body_images;
  if(typeof body==="string"){ try{ body=JSON.parse(body); }catch(e){ body=[]; } }
  return Array.isArray(body)?body:[];
}
function guidePhotoItems(){
  const out=[];
  (S.guides||[]).forEach(g=>{
    const urls=[];
    if(g.profile_image_url) urls.push(g.profile_image_url);
    guideBodyImages(g).forEach(im=>{ const u=typeof im==="string"?im:(im&&(im.url||im.src)); if(u) urls.push(u); });
    urls.forEach((url,i)=>{
      out.push({id:"guideimg-"+g.id+"-"+i, rank:"guide", scientificName:g.title||"공유 가이드", koreanName:guideCatLabel(g.category), profileImageUrl:url, profileImageCaption:"", profileImageLicense:"", _guideId:g.id});
    });
  });
  return out;
}
function openGalleryPhoto(p){
  if(!p) return;
  S.slideFs=false; try{ stopSlideTimer(); }catch(e){}
  if(p._guideId){ S.segment="guides"; S.guideId=p._guideId; S.view=null; }
  else { S.segment="taxonomy"; S.view={kind:"taxon",id:p.id}; }
  render();
}
function guidePhotoFields(panel, draft){
  draft.body_images=guideBodyImages(draft);
  const box=el(`<div></div>`);
  box.appendChild(el(`<div class="side-title" style="margin-top:.5rem">프로필 사진</div>`));
  const prev=el(`<div class="guide-thumb" style="width:88px;height:88px;margin:.3rem 0">${draft.profile_image_url?`<img src="${esc(draft.profile_image_url)}" alt=""/>`:`<span class="guide-x">✕</span>`}</div>`);
  const row=el(`<div style="display:flex;gap:.4rem;flex-wrap:wrap"></div>`);
  const file=el(`<label class="btn btn-line" style="min-height:32px">프로필 선택<input type="file" accept="image/*" hidden></label>`);
  file.querySelector("input").onchange=(e)=>{
    const f=e.target.files?.[0]; if(!f) return;
    if(f.size>1400000){ toast("이미지는 1.4MB 이하로"); return; }
    const rd=new FileReader();

function guideThumb(g){
  if(g&&g.profile_image_url) return g.profile_image_url;
  const own=guideBodyImages(g);
  if(own.length){ const im=own[0]; const u=typeof im==="string"?im:(im&&im.url); if(u) return u; }
  const ids=(S._guideLinks||[]).filter(r=>r.guide_id===g.id).map(r=>r.taxon_id);
  for(const id of ids){
    const t=S.taxa&&S.taxa[id];
    if(!t) continue;
    if(t.profileImageUrl) return t.profileImageUrl;
    const body=Array.isArray(t.bodyImages)?t.bodyImages:[];
    for(const im of body){
      const url=typeof im==="string"?im:(im&&(im.url||im.src));
      if(url) return url;
    }
  }
  return "";
}

if(taxon.rank!=="breed"){

    } else if(taxon.rank==="superfamily"){
      const families=sortTaxa(kids.filter(k=>k.rank==="family"));
      if(families.length===1){
        // 단형 상과: 과 대신 아과+속
        const onlyFam=families[0];
        panel.appendChild(el(`<p class="muted" style="font-size:.8rem;margin:-.25rem 0 .45rem">과가 하나뿐인 상과 · 하위는 아과·속으로 표시 · <button type="button" class="btn btn-line" style="min-height:28px;font-size:.75rem;padding:.15rem .45rem;display:inline-flex;vertical-align:middle" id="openOnlyFam">${lineageNameHtml(onlyFam)}</button></p>`));

          b.onclick=()=>{S.view={kind:"taxon",id:g.id};render();};

        });

      }
    } else {

      if(!kids.length) panel.appendChild(el(`<div class="empty">없음</div>`));
      else kids.forEach(k=>{
        const b=el(`<button type="button" class="list-btn"><span class="chip">${RANK_LABEL[k.rank]}</span>${lineageNameHtml(k)}</button>`);
        b.onclick=()=>{S.view={kind:"taxon",id:k.id};render();};
        panel.appendChild(b);
      });
    }
  }
  try{
    const kidHead=[...panel.querySelectorAll("h2")].find(h=>h.textContent.trim()==="하위 계통");
    if(kidHead){
      const hold=el(`<div></div>`);
      let n=kidHead.nextSibling;

  try{ appendRelatedGuides(panel, taxon); }catch(e){}
  w.appendChild(panel); return w;
}
function stopSlideTimer(){ if(S.slideTimer){ clearInterval(S.slideTimer); S.slideTimer=null; } }

function updateSlideStageOnly(){
  // 슬라이드 인덱스만 바뀔 때 전체 render 없이 무대·카운트·썸네일만 갱신
  if(S.segment!=="slides"){ try{ startSlideTimer(); }catch(e){} return; }
  if(S.slideFs){ render(); return; }
  const photos=slideGalleryPhotos().concat(guidePhotoItems());
  const n=Math.max(photos.length,1);
  const root=document.getElementById("root");
  if(!root){ render(); return; }
  const stage=root.querySelector(".theater-stage");
  const count=root.querySelector(".theater-count");
  const strip=root.querySelector(".theater-strip");
  if(!stage){ render(); return; }
  if(count) count.textContent=photos.length?((S.slide%n)+1)+" / "+photos.length:"0";
  if(photos.length){
    const p=photos[S.slide%n];
    const cap=(p.profileImageCaption||"").trim();
    const lic=(p.profileImageLicense||"").trim();
    stage.innerHTML=`<img class="theater-img" src="${esc(p.profileImageUrl)}" alt=""/><div class="theater-cap"><em>${esc(displaySciName(p))}</em><div class="muted">${esc(p.koreanName||"")}</div>${cap?`<div class="theater-meta">${esc(cap)}</div>`:""}${lic?`<div class="theater-lic">© ${esc(lic)}</div>`:""}</div>`;
    stage.onclick=()=>{ try{jiggleEl(stage);}catch(e){} setTimeout(()=>{openGalleryPhoto(p);},220);};
  } else {
    stage.innerHTML=`<div class="empty">프로필 이미지가 있는 종이 없습니다</div>`;
  }
  if(strip){
    strip.querySelectorAll(".theater-thumb").forEach((t,i)=>{
      t.classList.toggle("on", i===(S.slide%n));
    });
  }
}

function startSlideTimer(){
  stopSlideTimer();
  if(!S.slideAuto) return;
  const n=Math.max(speciesPhotos().length,1);
  S.slideTimer=setInterval(()=>{
    try{
      if(S.segment!=="slides"){ stopSlideTimer(); return; }
      if(S.modal || S.notifOpen) return;
      const photos=speciesPhotos();
      const nn=Math.max(photos.length,1);
      if(nn<2) return;
      S.slide=(S.slide+1)%nn;
      try{ sfx("slide"); }catch(e){}
      if(S.slideFs) render(); else updateSlideStageOnly();
    }catch(e){ console.warn("slide tick", e); try{ render(); }catch(e2){} }
  }, S.slideMs||4500);
}

      if(!lifeVisible(t) || !isCrayfishShown(t)) return;
      const g=S.slideGallery||"all";
      if(g && g!=="all" && g!=="extant" && g!=="fossil"){ if(!crayInCat(t,g)) return; }
      if(t.profileImageUrl){
        media.push({url:t.profileImageUrl, title:displaySciName(t)||"", sub:t.koreanName||"", lic:t.profileImageLicense||"", cap:t.profileImageCaption||"", id:t.id, kind:"profile"});
      }
      (t.bodyImages||[]).forEach((im,ii)=>{
        if(im&&im.url) media.push({url:im.url, title:displaySciName(t)||"", sub:(im.caption||"본문 이미지"), lic:im.license||"", cap:im.caption||"", id:t.id, kind:"body", idx:ii});
      });
    });
    const gal=el(`<div class="media-gallery"></div>`);
    gal.appendChild(el(`<h2>미디어 자료 <span class="muted" style="font-size:.8rem;font-weight:400">· ${media.length}점</span></h2>`));
    if(!media.length){
      gal.appendChild(el(`<div class="empty">등록된 이미지가 없습니다</div>`));
    } else {
      if(S.mediaPage==null) S.mediaPage=0;
      const per=24; // 약 6줄 × 4열
      const pages=Math.max(1, Math.ceil(media.length/per));
      if(S.mediaPage>=pages) S.mediaPage=pages-1;
      if(S.mediaPage<0) S.mediaPage=0;
      const slice=media.slice(S.mediaPage*per, S.mediaPage*per+per);
      const grid=el(`<div class="media-grid"></div>`);
      slice.forEach(m=>{
        const card=el(`<button type="button" class="media-card">
          <img src="${esc(m.url)}" alt="" loading="lazy"/>
          <div class="mc-meta"><em>${esc(m.title)}</em>
            <span class="muted">${esc(m.sub||m.kind)}</span>
            ${m.lic?`<div class="img-lic">© ${esc(m.lic)}</div>`:`<div class="img-lic" style="opacity:.35">라이선스 미입력</div>`}
          </div>
        </button>`);
        card.onclick=()=>{
          if(m.id){ S.segment="taxonomy"; S.view={kind:"taxon",id:m.id}; S.slideFs=false; stopSlideTimer(); render(); }
        };
        grid.appendChild(card);
      });
      gal.appendChild(grid);
      if(pages>1){
        const nav=el(`<div style="display:flex;gap:.4rem;align-items:center;justify-content:center;margin-top:.85rem;flex-wrap:wrap"></div>`);
        const prev=el(`<button type="button" class="btn btn-line" ${S.mediaPage<=0?"disabled":""}>이전</button>`);
        prev.onclick=()=>{ if(S.mediaPage>0){ S.mediaPage--; S._scrollTopAfterRender=true; render(); } };
        const info=el(`<span class="muted" style="font-size:.8rem">${S.mediaPage+1} / ${pages}</span>`);
        const next=el(`<button type="button" class="btn btn-line" ${S.mediaPage>=pages-1?"disabled":""}>다음</button>`);
        next.onclick=()=>{ if(S.mediaPage<pages-1){ S.mediaPage++; S._scrollTopAfterRender=true; render(); } };
        nav.appendChild(prev); nav.appendChild(info); nav.appendChild(next);
        gal.appendChild(nav);
      }
    }
    w.appendChild(gal);
  }
  // restart timer when viewing slides
  if(S.slideAuto) startSlideTimer(); else stopSlideTimer();
  if(S._jiggleSlide){ S._jiggleSlide=false; setTimeout(()=>{ const st=w.querySelector(".theater-stage"); jiggleEl(st); },30); }
  return w;
}
function viewFs(){
  const photos=speciesPhotos();
  const n=Math.max(photos.length,1);
  const p=photos.length?photos[S.slide%n]:null;
  const fadeCls=S.slideFade?" fs-fade":"";
  const full=el(`<div class="slides-full${fadeCls}"><div class="stage">${p?`<img src="${esc(p.profileImageUrl)}" alt=""/>`:""}</div><div class="bar"></div></div>`);
  const bar=full.querySelector(".bar");
  const prev=el(`<button type="button" class="btn btn-line">‹</button>`);
  prev.onclick=()=>{S.slide=(S.slide+n-1)%n; try{sfx("slide")}catch(e){} render();};
  const next=el(`<button type="button" class="btn btn-line">›</button>`);
  next.onclick=()=>{S.slide=(S.slide+1)%n; try{sfx("slide")}catch(e){} render();};
  const mk=(label,on,fn)=>{ const b=el(`<button type="button" class="btn ${on?"btn-gold":"btn-line"}" style="min-height:34px;font-size:.75rem">${label}</button>`); b.onclick=fn; return b; };
  const autoBtn=mk(S.slideAuto?"자동 ON":"자동 OFF", !!S.slideAuto, ()=>{ S.slideAuto=!S.slideAuto; if(S.slideAuto) startSlideTimer(); else stopSlideTimer(); render(); });
  const fadeBtn=mk(S.slideFade?"페이드 ON":"페이드 OFF", !!S.slideFade, ()=>{ S.slideFade=!S.slideFade; render(); });
  const shufBtn=mk("셔플", false, ()=>{ if(photos.length){ S.slide=Math.floor(Math.random()*photos.length); try{sfx("slide")}catch(e){} render(); } });
  const close=el(`<button type="button" class="btn btn-gold">닫기</button>`);
  close.onclick=()=>{S.slideFs=false;S.segOpen=true;stopSlideTimer();render();};
  bar.appendChild(prev); bar.appendChild(next);
  bar.appendChild(autoBtn); bar.appendChild(fadeBtn); bar.appendChild(shufBtn);
  bar.appendChild(el(`<div class="spacer"></div>`));
  bar.appendChild(close);
  if(S.slideAuto) startSlideTimer();
  return full;
}

async function maybeResetPublicChat(){
  

  try{
    const {data:settings}=await sb.from("settings").select("key,value").in("key",["public_chat_reset_days","public_chat_last_reset"]);
    const map={}; (settings||[]).forEach(s=>map[s.key]=s.value);
    const days=Math.max(1, Math.min(7, parseInt(map.public_chat_reset_days||S.publicChatResetDays||7,10)||7));
    S.publicChatResetDays=days;
    const last=map.public_chat_last_reset?new Date(map.public_chat_last_reset):null;
    const now=new Date();
    if(now.getHours()>=5){
      const need=!last || (now-last)>=days*24*3600e3;
      if(need && isAdmin()){
        await sb.from("public_chat").delete().eq("room", SITE_KIND).neq("id","00000000-0000-0000-0000-000000000000");
        await sb.from("settings").upsert({key:"public_chat_last_reset",value:now.toISOString()});
        toast("공공 토론방 주기 초기화");
      }
    }
  }catch(e){ console.warn("chat reset",e); }
}

function viewNotif(){

  const d=el(`<div class="drawer open${quiet?" no-anim":""}"><div class="drawer-head"><strong class="gold">내 알림</strong><div style="display:flex;gap:.35rem;align-items:center"><button type="button" class="btn btn-line" id="clrAll" style="min-height:32px;font-size:.78rem">일괄 삭제</button><button type="button" class="btn btn-ghost" id="x">닫기</button></div></div><div class="drawer-body" id="bd"></div></div>`);
  d.querySelector("#x").onclick=()=>{S.notifOpen=false;render();};
  const clr=d.querySelector("#clrAll");
  if(clr) clr.onclick=async()=>{
    if(!isLogged()) return toast("로그인 필요");
    if(!confirm("알림을 모두 삭제할까요?\n(화면에 보이는 내 알림 기준)")) return;
    const uid=S.session.user.id;
    try{
      // 사용자 알림
      let q=sb.from("notifications").delete().eq("user_id", uid);
      const {error:e1}=await q;
      if(e1) console.warn(e1);
      // 관리자 audience 알림 (관리자인 경우)
      if(isMod()){
        try{ await sb.from("notifications").delete().eq("audience","admin"); }catch(e){}
      }
      // 로컬 상태
      S.notifications=[];
      S.unread=0;
      try{ const dismissed=JSON.parse(localStorage.getItem("notifDismissed")||"[]"); localStorage.setItem("notifDismissed","[]"); }catch(e){}
      toast("알림을 삭제했습니다");
      S._notifQuiet=true;
      render();
    }catch(e){ alert(e.message||e); }
  };
  const body=d.querySelector("#bd");
  if(!isLogged()) body.innerHTML=`<div class="panel"><p>로그인해주세요</p></div>`;
  else {
    if(S.unread>0) markNotificationsRead().then(()=>{ /* 패널 다시 페이드하지 않음 */ try{ const b=document.querySelector(".topbar .badge"); if(b) b.remove(); S.unread=0; }catch(e){} });
    const filters=[
      ["all","전체"],
      ["message","메시지"],
      ["suggestion","건의"],
      ["report","신고"],
      ["block_request","차단"],
      ["edit","수정"],
      ["guide_comment","댓글"],
    ];
    const tabs=el(`<div class="tabs-mini notif-filters" style="margin-bottom:.65rem;flex-wrap:wrap"></div>`);
    filters.forEach(([id,lab])=>{
      const b=el(`<button type="button" class="${S.notifFilter===id?"on":""}">${lab}</button>`);
      b.onclick=()=>{ S.notifFilter=id; S._notifQuiet=true; render(); };
      tabs.appendChild(b);
    });
    body.appendChild(tabs);
    const feedRow=el(`<div style="display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:0 0 .65rem;padding:.45rem .55rem;border:1px solid color-mix(in oklab,var(--gold) 18%,transparent);border-radius:10px;background:color-mix(in oklab,var(--bg-inset) 80%,transparent)">
      <div style="min-width:0"><div style="font-size:.85rem;font-weight:600">일괄 문서편집 알림</div>
      <div class="muted" style="font-size:.72rem;line-height:1.35">문서 저장 시 쌓이는 수정 알림 (기본 꺼짐)</div></div>
      <button type="button" class="btn ${_notifEditFeed?"btn-gold":"btn-line"}" id="editFeed" style="min-height:34px;flex-shrink:0;font-size:.78rem">${_notifEditFeed?"ON":"OFF"}</button>
    </div>`);
    feedRow.querySelector("#editFeed").onclick=()=>{
      _notifEditFeed=!_notifEditFeed;
      try{ localStorage.setItem("notifEditFeed", _notifEditFeed?"1":"0"); }catch(e){}
      toast("문서편집 알림 "+(_notifEditFeed?"켜짐":"꺼짐"));
      S._notifQuiet=true;
      loadNotifications().then(()=>{ render(); });
    };
    body.appendChild(feedRow);
    let list=S.notifications||[];
    if(!getEditNotifOn()) list=list.filter(n=>(n.kind||"")!=="edit");
    if(S.notifFilter!=="all") list=list.filter(n=>(n.kind||"")===S.notifFilter);
    if(!list.length) body.appendChild(el(`<div class="empty">${S.notifFilter==="all"?"알림이 없습니다":"해당 유형 알림 없음"}</div>`));
    list.forEach(n=>{
      const kindLabel={suggestion:"건의",report:"신고",block_request:"차단",message:"메시지",edit:"수정",guide_comment:"댓글"}[n.kind]||n.kind||"";
      const wrap=el(`<div class="notif-swipe" style="margin-bottom:.45rem"></div>`);
      const actions=el(`<div class="notif-swipe-actions">삭제</div>`);
      const inner=el(`<div class="notif-swipe-inner notif-item ${n.read_at?"":"unread"}"><div style="display:flex;justify-content:space-between;gap:.5rem;align-items:baseline"><div style="font-weight:600">${esc(n.title||kindLabel)}</div><span class="muted" style="font-size:.7rem;white-space:nowrap">${esc(kindLabel)}</span></div><div class="muted" style="font-size:.85rem;margin-top:.25rem">${esc(n.body||"")}</div></div>`);
      
      if(n.kind==="message"){
        // 1:1 토론 제거됨 — 알림만 표시
        const open=el(`<button type="button" class="btn btn-line" style="margin-top:.45rem;min-height:34px">공공 토론</button>`);
        open.onclick=(e)=>{ e.stopPropagation(); S.notifOpen=false; S.segment="chat"; S.chatMode="public"; S.modal=null; render(); };
        inner.appendChild(open);
      }
      if(n.kind==="guide_comment" && n.meta&&n.meta.guide_id){
        const open=el(`<button type="button" class="btn btn-line" style="margin-top:.45rem;min-height:34px">가이드 열기</button>`);
        open.onclick=(e)=>{ e.stopPropagation(); S.notifOpen=false; S.segment="guides"; S.guideId=n.meta.guide_id; S.modal=null; render(); };
        inner.appendChild(open);
      }
      let startX=0, dx=0, open=false;
      const setX=(x)=>{ inner.style.transform=`translateX(${x}px)`; };
      const doDelete=async()=>{
        const nid=String(n.id);
        if(!nid.startsWith("rep-") && !nid.startsWith("fr-")){
          try{ await sb.from("notifications").delete().eq("id",n.id); }catch(e){ console.warn(e); }
        }
        const dismissed=JSON.parse(localStorage.getItem("brachy_dismissed_notifs")||"[]");
        if(!dismissed.includes(nid)){ dismissed.push(nid); if(dismissed.length>400) dismissed.splice(0,dismissed.length-400); localStorage.setItem("brachy_dismissed_notifs",JSON.stringify(dismissed)); }
        S.dismissedNotifs=dismissed;
        S.notifications=(S.notifications||[]).filter(x=>String(x.id)!==nid);
        S.unread=(S.notifications||[]).filter(x=>!x.read_at).length;
        toast("알림 삭제"); S._notifQuiet=true; render();
      };
      // 오른쪽 스와이프 → 왼쪽 삭제 버튼 노출 / 충분히 밀면 바로 삭제
      const finishDrag=()=>{
        inner.style.transition="transform .15s ease";
        if(dx>56){ doDelete(); return; }
        if(dx>36){ open=true; setX(72); }
        else { open=false; setX(0); }
      };
      inner.addEventListener("touchstart",e=>{ startX=e.touches[0].clientX; dx=0; inner.style.transition="none"; },{passive:true});
      inner.addEventListener("touchmove",e=>{
        dx=e.touches[0].clientX-startX;
        if(dx>0) setX(Math.min(80,dx));
        else setX(0);
      },{passive:true});
      inner.addEventListener("touchend",finishDrag);
      let down=false;
      inner.addEventListener("mousedown",e=>{ down=true; startX=e.clientX; dx=0; inner.style.transition="none"; e.preventDefault(); });
      const onMove=e=>{ if(!down) return; dx=e.clientX-startX; if(dx>0) setX(Math.min(80,dx)); else setX(0); };
      const onUp=()=>{ if(!down) return; down=false; finishDrag(); };
      window.addEventListener("mousemove",onMove);
      window.addEventListener("mouseup",onUp);
      actions.onclick=(e)=>{ e.stopPropagation(); doDelete(); };
      wrap.appendChild(actions); wrap.appendChild(inner); body.appendChild(wrap);
    });
  }
  return d;
}
