          <div class="muted" style="font-size:.78rem;margin-bottom:.35rem">선택한 이미지를 클립보드에 복사한 뒤, 본문 원하는 곳에 붙여넣기 하세요.</div>
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:.45rem">
            <label style="display:flex;align-items:center;gap:.35rem;font-size:.8rem;cursor:pointer">
              <input type="checkbox" id="lastCmdChk" checked style="accent-color:var(--gold)"/>
              <code style="font-size:.75rem;word-break:break-all">${esc(cmd)}</code>
            </label>
            <button type="button" class="btn btn-gold" id="lastCmdCopy" style="min-height:30px;font-size:.75rem">복사</button>
          </div>
        </div>`);
        bim.appendChild(ban);
        ban.querySelector("#lastCmdCopy").onclick=async()=>{
          const chk=ban.querySelector("#lastCmdChk");
          if(chk && !chk.checked){ toast("체크박스를 켠 뒤 복사하세요"); return; }
          await copyWikiCmd(cmd);
        };
      }
      bodyImgs.forEach((img,i)=>{
        const cmd=fileCmd(i, img.caption||"");
        const row=el(`<div class="notif-item" style="display:flex;flex-wrap:wrap;gap:.4rem;align-items:center">
          <label style="display:flex;align-items:center;gap:.3rem;cursor:pointer" title="복사할 명령어 선택">
            <input type="checkbox" class="img-cmd-chk" data-i="${i}" style="accent-color:var(--gold)"/>
            <span class="chip">${i}</span>
          </label>
          <img src="${esc(img.url)}" style="width:40px;height:40px;object-fit:cover;border-radius:4px;background:#111"/>
          <input data-i="${i}" class="cap" value="${esc(img.caption||"")}" style="flex:1;min-width:5rem;min-height:30px;border-radius:6px;border:1px solid var(--line);background:var(--bg-inset);padding:.25rem .4rem"/>
          <button type="button" class="btn btn-line" data-ins="${i}" style="min-height:30px;font-size:.75rem">복사</button>
          ${descOnly?"":`<button type="button" class="btn btn-danger" data-del="${i}" style="min-height:30px">×</button>`}
        </div>`);
        bim.appendChild(row);
      });
      bim.querySelectorAll("input.cap").forEach(inp=>{
        inp.onchange=()=>{ bodyImgs[+inp.getAttribute("data-i")].caption=inp.value; refreshPrev(); renderBim(); };
      });
      bim.querySelectorAll("[data-ins]").forEach(b=>{
        b.onclick=async()=>{
          const idx=+b.getAttribute("data-ins");
          const row=b.closest(".notif-item");
          const chk=row?.querySelector(".img-cmd-chk");
          if(chk) chk.checked=true;
          const cap=bodyImgs[idx]?.caption||"";
          await copyWikiCmd(fileCmd(idx,cap));
        };
      });
      bim.querySelectorAll("[data-del]").forEach(b=>{
        b.onclick=()=>{
          const di=+b.getAttribute("data-del");
          bodyImgs.splice(di,1);
          if(lastAddedIdx===di) lastAddedIdx=null;
          else if(lastAddedIdx!=null && lastAddedIdx>di) lastAddedIdx--;
          renderBim(); refreshPrev();
        };
      });
    };
    renderBim();

    const addBodyFiles=async(files)=>{
      if(descOnly) return toast("이 계급에서는 본문 이미지 추가 불가");
      for(const f of files){
        if(!f.type||!f.type.startsWith("image/")) continue;
        if(f.size>2e6){ toast(f.name+" 너무 큼 (2MB↓)"); continue; }
        try{
          let data=await compressImageFile(f, 900, 0.82);
          if(data.length>500000) data=await compressImageFile(f, 640, 0.7);
          data=await materializeImageUrl(data, "body");
          bodyImgs.push({url:data, caption:f.name.replace(/\\.[^.]+$/,"")});
          const idx=bodyImgs.length-1;
          lastAddedIdx=idx;
          await copyWikiCmd(fileCmd(idx, bodyImgs[idx].caption||""));
        }catch(err){ toast(err.message||String(err)); }
      }
      renderBim();
    };

    const onDrag=e=>{ e.preventDefault(); e.stopPropagation(); dz.classList.add("dragover"); };
    const onLeave=e=>{ e.preventDefault(); dz.classList.remove("dragover"); };
    ["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,onDrag));
    ["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,onLeave));
    dz.addEventListener("drop",async e=>{
      e.preventDefault(); dz.classList.remove("dragover");
      const files=[...(e.dataTransfer?.files||[])];
      if(files.length) await addBodyFiles(files);
    });
    ta.addEventListener("dragover",e=>e.preventDefault());
    ta.addEventListener("drop",async e=>{
      e.preventDefault();
      const files=[...(e.dataTransfer?.files||[])];
      if(files.length) await addBodyFiles(files);
    });

    modal.querySelector("#bf")?.addEventListener("change",async e=>{
      const files=[...(e.target.files||[])];
      e.target.value="";
      if(files.length) await addBodyFiles(files);
    });
    modal.querySelector("#addbu")?.addEventListener("click",async()=>{
      const u=modal.querySelector("#bu")?.value.trim();
      if(!u) return;
      bodyImgs.push({url:u,caption:""});
      modal.querySelector("#bu").value="";
      const idx=bodyImgs.length-1;
      lastAddedIdx=idx;
      await copyWikiCmd(fileCmd(idx,""));
      renderBim();
    });
    modal.querySelector("#togglePrev").onclick=()=>{
      showPrev=!showPrev;
      prev.style.display=showPrev?"block":"none";
      modal.querySelector("#togglePrev").textContent=showPrev?"편집으로":"미리보기";
      if(showPrev){ ta.style.display="none"; refreshPrev(); }
      else ta.style.display="";
    };
    ta.addEventListener("input",()=>{ if(showPrev) refreshPrev(); });

    modal.querySelector("#c").onclick=close;
    modal.querySelector("#go").onclick=async()=>{
      let next;
      if(descOnly){
        next={...t, description:ta.value};
      } else {
        // 프로필 사진은 문서 열람의 연필 버튼에서만 수정 (여기서는 기존값 유지)
        next={
          ...t,
          scientificName:modal.querySelector("#sci").value.trim(),
          koreanName:modal.querySelector("#ko").value.trim(),
          authority:modal.querySelector("#au").value.trim(),
          description:ta.value,
          profileImageUrl:t.profileImageUrl||"",
          profileImageCaption:t.profileImageCaption||"",
          profileImageLicense:t.profileImageLicense||"",
          bodyImages:bodyImgs,
          extinct:!!(modal.querySelector("#extinct")&&modal.querySelector("#extinct").checked),
          fossil:!(modal.querySelector("#nonFossil")&&modal.querySelector("#nonFossil").checked)
        };
      }
      try{
        await saveTaxon(next, descOnly?"설명 수정":"문서 수정");
        toast("저장됨"); close(); render();
      }catch(e){ alert(e.message||e); }
    };
  }
  else if(m.type==="history"){
    modal.style.maxWidth="min(640px,96vw)";
    modal.innerHTML=`<h2 class="gold" style="font-family:var(--serif);margin-top:0">문서 역사</h2>
      <p class="muted" style="font-size:.85rem;margin:0 0 .55rem">버전을 고른 뒤 <b>대조</b>를 누르거나, 각 행의 <b>바로 이전과 대조</b>를 사용하세요.</p>
      <div id="h"><div class="muted">불러오는 중…</div></div>
      <div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.65rem">
        <button class="btn btn-gold" id="cmp" style="flex:1">대조</button>
        <button class="btn btn-ghost" id="c" style="flex:1">닫기</button>
      </div>`;
    modal.querySelector("#c").onclick=close;
    const hb=modal.querySelector("#h");
    let revs=[];
    const snapText=(snap)=>{
      try{
        if(snap==null||snap==="") return "";
        const t=snapshotDesc(snap);
        if(t) return t;
        const o=typeof snap==="string"?JSON.parse(snap):snap;
        if(o&&typeof o==="object"){
          return [o.scientificName||o.scientific_name||"", o.koreanName||o.korean_name||"", o.authority||"", o.description||""].filter(Boolean).join("\n");
        }
        return String(snap);
      }catch(e){ return String(snap||""); }
    };
    const openDiff=(older, newer, title)=>{
      if(!older||!newer){ toast("대조할 버전이 없습니다"); return; }
      let leftTxt=snapText(older.snapshot);
      let rightTxt=snapText(newer.snapshot);
      if(!leftTxt && !rightTxt){
        leftTxt=older.summary||"(내용 없음)";
        rightTxt=newer.summary||"(내용 없음)";
        toast("스냅샷이 없어 요약만 대조합니다");
      }
      S.modal={
        type:"diff",
        taxonId:m.taxonId,
        title:title||((newer.summary||"이후")+"  ↔  "+(older.summary||"이전")),
        leftLabel:new Date(older.at).toLocaleString("ko-KR")+" · 이전",
        rightLabel:new Date(newer.at).toLocaleString("ko-KR")+" · 이후",
        left:leftTxt,
        right:rightTxt,
        leftImgs:extractSnapImages(older.snapshot),
        rightImgs:extractSnapImages(newer.snapshot)
      };
      render();
    };
    const paint=()=>{
      hb.innerHTML="";
      if(!revs.length){
        hb.innerHTML=`<div class="empty">기록 없음<br/><span class="muted" style="font-size:.8rem">문서를 저장하면 역사가 쌓입니다.</span></div>`;
        return;
      }
      for(let i=0;i<revs.length;i++){
        const r=revs[i];
        if(!(r.charsAdded||r.charsRemoved)){
          const newer=snapshotTextLen(r.snapshot);
          const older=i+1<revs.length?snapshotTextLen(revs[i+1].snapshot):newer;
          r.charsAdded=Math.max(0, newer-older);
          r.charsRemoved=Math.max(0, older-newer);
        }
      }
      revs.forEach((r,idx)=>{
        const hasSnap=!!(r.snapshot&&String(r.snapshot).length>2);
        const nick=(formatStaffNick(r.editorName||"", r.editorRole||"").html)||esc(r.editorName||"");
        const row=el(`<div class="hist-row">
          <div style="display:flex;flex-direction:column;gap:.2rem;flex-shrink:0">
            <label style="font-size:.72rem;color:var(--muted)"><input type="radio" name="diffA" value="${idx}"/> 이전</label>
            <label style="font-size:.72rem;color:var(--muted)"><input type="radio" name="diffB" value="${idx}"/> 이후</label>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;display:flex;flex-wrap:wrap;gap:.35rem;align-items:center">${esc(r.summary||"수정")} ${formatCharDelta(r.charsAdded,r.charsRemoved)} ${hasSnap?"":'<span class="muted" style="font-size:.72rem">(스냅샷 없음)</span>'}</div>
            <div class="muted" style="font-size:.8rem">${nick} ${esc(r.editorIp||"")} · ${new Date(r.at).toLocaleString("ko-KR")}</div>
          </div>
        </div>`);
        const tools=el(`<div style="display:flex;flex-direction:column;gap:.25rem;flex-shrink:0"></div>`);
        if(idx+1<revs.length){
          const adj=el(`<button type="button" class="btn btn-line" style="min-height:30px;font-size:.72rem">바로 이전</button>`);
          adj.onclick=(ev)=>{ ev.preventDefault(); openDiff(revs[idx+1], revs[idx], (r.summary||"수정")+" · 바로 이전과 대조"); };
          tools.appendChild(adj);
        }
        if(isAdmin() && hasSnap){
          const revBtn=el(`<button type="button" class="btn btn-line" style="min-height:30px;font-size:.72rem">복원</button>`);
          revBtn.onclick=async()=>{
            if(!confirm("이 기록 스냅샷으로 문서를 되돌릴까요?")) return;
            try{
              const snap=typeof r.snapshot==="string"?JSON.parse(r.snapshot):r.snapshot;
              const next=rowToTaxon({
                id:m.taxonId,
                rank:snap.rank,
                parent_id:snap.parentId??snap.parent_id??null,
                scientific_name:snap.scientificName||snap.scientific_name||"",
                korean_name:snap.koreanName||snap.korean_name||"",
                authority:snap.authority||"",
                description:snap.description||"",
                profile_image_url:snap.profileImageUrl||snap.profile_image_url||"",
                profile_image_caption:snap.profileImageCaption||snap.profile_image_caption||"",
                profile_image_license:snap.profileImageLicense||snap.profile_image_license||"",
                body_images:snap.bodyImages||snap.body_images||[],
                catalog_no:snap.catalogNo??snap.catalog_no??null,
                is_extinct:snap.extinct??snap.is_extinct,
                is_fossil:snap.fossil!==false
              });
              await saveTaxon(next, "역사 복원: "+(r.summary||""));
              toast("복원됨"); close(); render();
            }catch(e){ alert(e.message||e); }
          };
          tools.appendChild(revBtn);
        }
        row.appendChild(tools);
        hb.appendChild(row);
      });
      if(revs.length>=1){ const b0=modal.querySelector('input[name="diffB"][value="0"]'); if(b0) b0.checked=true; }
      if(revs.length>=2){ const a1=modal.querySelector('input[name="diffA"][value="1"]'); if(a1) a1.checked=true; }
    };
    modal.querySelector("#cmp").onclick=()=>{
      const aEl=modal.querySelector('input[name="diffA"]:checked');
      const bEl=modal.querySelector('input[name="diffB"]:checked');
      if(!aEl||!bEl) return toast("이전·이후 버전을 각각 선택하세요");
      const ai=+aEl.value, bi=+bEl.value;
      if(ai===bi) return toast("서로 다른 두 버전을 선택하세요");
      const olderIdx=Math.max(ai,bi), newerIdx=Math.min(ai,bi);
      openDiff(revs[olderIdx], revs[newerIdx]);
    };
    (async()=>{
      try{
        let res=await sb.from("revisions").select("*").eq("taxon_id", m.taxonId).order("at",{ascending:false}).limit(80);
        if(res.error) throw res.error;
        revs=(res.data||[]).map(r=>({
          id:r.id, taxonId:r.taxon_id, at:new Date(r.at).getTime(),
          summary:r.summary||"", editorName:r.editor_name||"", editorIp:r.editor_ip||"",
          editorUserId:r.editor_user_id||null, snapshot:r.snapshot||null, editorRole:"",
          charsAdded:r.chars_added||0, charsRemoved:r.chars_removed||0
        }));
        try{
          const eids=[...new Set(revs.map(x=>x.editorUserId).filter(Boolean))];
          if(eids.length){
            const {data:ps}=await sb.from("profiles").select("id,role").in("id",eids);
            const rm={}; (ps||[]).forEach(p=>{ rm[p.id]=p.role; });
            revs.forEach(x=>{ if(x.editorUserId&&rm[x.editorUserId]) x.editorRole=rm[x.editorUserId]; });
          }
        }catch(e){}
        const local=(S.revisions||[]).filter(r=>r.taxonId===m.taxonId);
        local.forEach(L=>{
          if(!revs.find(x=>x.id===L.id)) revs.push({
            id:L.id, taxonId:L.taxonId, at:+L.at||new Date(L.at).getTime(),
            summary:L.summary||"", editorName:L.editorName||"", editorIp:L.editorIp||"",
            editorUserId:L.editorUserId||null, snapshot:L.snapshot||null, editorRole:L.editorRole||"",
            charsAdded:L.charsAdded||0, charsRemoved:L.charsRemoved||0
          });
        });
        revs.sort((a,b)=>b.at-a.at);
        paint();
      }catch(e){
        revs=(S.revisions||[]).filter(r=>r.taxonId===m.taxonId).slice().sort((a,b)=>b.at-a.at);
        paint();
        if(e&&e.message) hb.insertAdjacentHTML("afterbegin", `<div class="muted" style="font-size:.75rem;margin-bottom:.35rem">서버 로드 실패 · 로컬 기록 표시: ${esc(e.message)}</div>`);
      }
    })();
  }
  else if(m.type==="diff"){
    modal.style.maxWidth="min(720px,96vw)";
    const rows=lineDiff(m.left||"", m.right||"");
    const changed=rows.filter(r=>r.t==="add"||r.t==="del");
    const show=changed.length?changed:rows;
    const linesHtml=show.map(r=>{
      const mark=r.t==="del"?"−":r.t==="add"?"+":"·";
      // URL 줄이면 미리보기 힌트만 텍스트에 유지
      return `<div class="diff-line ${r.t}">${mark} ${esc(r.text)}</div>`;
    }).join("");
    const L=m.leftImgs||{profile:"",bodies:[]};
    const R=m.rightImgs||{profile:"",bodies:[]};
    const imgCell=(url,label,tone)=>{
      if(!isLikelyImageUrl(url)){
        return `<div class="diff-img-cell ${tone}"><div class="muted" style="font-size:.72rem">${label}</div><div class="muted" style="font-size:.75rem;padding:.6rem 0">${esc(url||"(없음)")}</div></div>`;
      }
      return `<div class="diff-img-cell ${tone}"><div class="muted" style="font-size:.72rem;margin-bottom:.25rem">${label}</div><img src="${esc(url)}" alt="" style="max-width:100%;max-height:160px;object-fit:contain;border-radius:8px;background:rgba(0,0,0,.25)" loading="lazy" onerror="this.style.display='none'"/></div>`;
    };
    const sameProf=L.profile===R.profile;
    let imgBlock="";
    if(L.profile||R.profile||(L.bodies&&L.bodies.length)||(R.bodies&&R.bodies.length)){
      imgBlock=`<div class="side-title" style="margin:.15rem 0 .35rem">이미지 대조</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-bottom:.55rem">
          ${imgCell(L.profile,"− 이전 프로필","del")}
          ${imgCell(R.profile,"+ 이후 프로필","add")}
        </div>`;
      if(!sameProf && (L.profile||R.profile)){
        imgBlock+=`<p class="muted" style="font-size:.72rem;margin:-.25rem 0 .45rem">${L.profile&&R.profile?"프로필 사진이 다릅니다.":(R.profile?"프로필 사진이 추가되었습니다.":"프로필 사진이 제거되었습니다.")}</p>`;
      }
      // body images side by side lists
      const maxB=Math.max((L.bodies||[]).length,(R.bodies||[]).length);
      if(maxB>0){
        let bodyRows="";
        for(let bi=0;bi<maxB;bi++){
          bodyRows+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-bottom:.35rem">
            ${imgCell((L.bodies||[])[bi]||"","− 본문 "+(bi+1),"del")}
            ${imgCell((R.bodies||[])[bi]||"","+ 본문 "+(bi+1),"add")}
          </div>`;
        }
        imgBlock+=`<div class="muted" style="font-size:.72rem;margin:.2rem 0">본문 이미지</div>`+bodyRows;
      }
    }
    modal.innerHTML=`<h2 class="gold" style="font-family:var(--serif);margin:0 0 .35rem;font-size:1.05rem">${esc(m.title||"문서 대조")}</h2>
      <div class="muted" style="font-size:.72rem;margin-bottom:.4rem">${esc(m.leftLabel||"이전")} → ${esc(m.rightLabel||"이후")}</div>
      ${imgBlock}
      <div class="diff-meta" style="font-size:.72rem;margin-bottom:.35rem">
        <span style="color:#f0a0a0">− 이전만</span>
        <span style="color:#9ddeb0;margin-left:.5rem">+ 이후만</span>
        ${changed.length?`<span class="muted" style="margin-left:.5rem">텍스트 변경 ${changed.length}줄</span>`:`<span class="muted" style="margin-left:.5rem">텍스트 차이 없음</span>`}
      </div>
      <div class="diff-unified" style="max-height:min(40vh,360px);overflow:auto;border:1px solid color-mix(in oklab,var(--gold) 22%,transparent);border-radius:10px;padding:.45rem .5rem;background:rgba(0,0,0,.25)">${linesHtml||`<div class="diff-line same">· (텍스트 차이 없음)</div>`}</div>
      <div style="display:flex;gap:.4rem;margin-top:.55rem">
        <button class="btn btn-line" id="back" style="flex:1">역사로</button>
        <button class="btn btn-ghost" id="c" style="flex:1">닫기</button>
      </div>`;
    modal.querySelector("#c").onclick=close;
    modal.querySelector("#back").onclick=()=>{
      if(m.taxonId) S.modal={type:"history",taxonId:m.taxonId};
      else S.modal=null;
      render();
    };
  }
  else if(m.type==="report"){ const labels={suggestion:"건의",report:"신고",block_request:"차단 요청"};
    modal.innerHTML=`<h2 class="gold" style="font-family:var(--serif);margin-top:0">${labels[m.kind]||m.kind}</h2><label class="field"><span>내용</span><textarea id="b"></textarea></label><p id="rerr" style="color:var(--danger);font-size:.85rem;min-height:1.1em"></p><div style="display:flex;gap:.5rem;justify-content:flex-end"><button class="btn btn-ghost" id="c">취소</button><button class="btn btn-gold" id="go">제출</button></div>`;
    if(m.preset) modal.querySelector("#b").value=m.preset;
    modal.querySelector("#c").onclick=close;
    modal.querySelector("#go").onclick=async()=>{
      const body=(modal.querySelector("#b").value||"").trim(); if(!body) return (modal.querySelector("#rerr").textContent="내용을 입력하세요");
      modal.querySelector("#rerr").textContent="";
      const ip=await clientIp();
      const {error}=await sb.from("reports").insert({reporter_id:S.session?.user?.id||null,reporter_ip:ip,kind:m.kind,body,status:"open"});
      if(error) return (modal.querySelector("#rerr").textContent=error.message);
      try{ await sb.from("notifications").insert({audience:"admin",kind:m.kind,title:"새 "+(labels[m.kind]||m.kind),body}); }catch(e){ console.warn(e); }
      toast("제출되었습니다"); close();

<script>
/* PWA: manifest + service worker + install prompt */
(function(){
  const ICON = (document.querySelector('link[rel="icon"]')||{}).href || '';
  const manifest = {
    name: "관상용 가재 도감",
    short_name: "관상게",
    description: "한국어 게 도감을 관상용 기준으로 재구성한 도감",
    start_url: ".",
    scope: ".",
    display: "standalone",
    background_color: "#102018",
    theme_color: "#102018",
    lang: "ko",
    icons: ICON ? [
      { src: ICON, sizes: "64x64", type: "image/png", purpose: "any" },
      { src: ICON, sizes: "192x192", type: "image/png", purpose: "any maskable" },
      { src: ICON, sizes: "512x512", type: "image/png", purpose: "any maskable" }
    ] : []
  };
  try{
    const blob = new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"});
    const url = URL.createObjectURL(blob);
    let link = document.querySelector('link[rel="manifest"]');
    if(!link){ link=document.createElement("link"); link.rel="manifest"; document.head.appendChild(link); }
    link.href = url;
  }catch(e){ console.warn("manifest", e); }

  window.__pwaDeferredPrompt = null;
  window.__pwaInstalled = window.matchMedia("(display-mode: standalone)").matches
    || window.navigator.standalone === true;
  window.addEventListener("beforeinstallprompt", (e)=>{
    e.preventDefault();
    window.__pwaDeferredPrompt = e;
  });
  window.addEventListener("appinstalled", ()=>{
    window.__pwaInstalled = true;
    window.__pwaDeferredPrompt = null;
  });

  // Service worker (HTTPS 또는 localhost에서만 동작)
  if("serviceWorker" in navigator){
    const swCode = `
      const CACHE = "brachyura-shell-v1";
      self.addEventListener("install", (e)=>{
        e.waitUntil((async()=>{
          const c = await caches.open(CACHE);
          try{ await c.addAll(["./"]); }catch(err){}
          self.skipWaiting();
        })());
      });
      self.addEventListener("activate", (e)=>{
        e.waitUntil((async()=>{
          const keys = await caches.keys();
          await Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)));
          self.clients.claim();
        })());
      });
      self.addEventListener("fetch", (e)=>{
        const req = e.request;
        if(req.method!=="GET") return;
        e.respondWith((async()=>{
          try{
            const net = await fetch(req);
            if(net && net.ok && req.url.startsWith(self.location.origin)){
              const c = await caches.open(CACHE);
              try{ c.put(req, net.clone()); }catch(err){}
            }
            return net;
          }catch(err){
            const hit = await caches.match(req);
            if(hit) return hit;
            const shell = await caches.match("./");
            if(shell) return shell;
            throw err;
          }
        })());
      });
    `;
    try{
      const swBlob = new Blob([swCode], {type:"text/javascript"});
      const swUrl = URL.createObjectURL(swBlob);
      // blob SW often blocked — try register relative if same-origin file
      navigator.serviceWorker.register(swUrl).catch(()=>{
        // ignore; host may block blob SW
      });
    }catch(e){}
  }

  window.installPwa = async function(){
    if(window.__pwaInstalled){
      alert("이미 앱으로 설치되어 있거나, 홈 화면에서 실행 중입니다.");
      return {ok:true, status:"installed"};
    }
    const ev = window.__pwaDeferredPrompt;
    if(ev){
      ev.prompt();
      const choice = await ev.userChoice;
      window.__pwaDeferredPrompt = null;
      return {ok: choice.outcome==="accepted", status: choice.outcome};
    }
    // iOS / unsupported
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
    if(isIOS){
      alert("iPhone/iPad: Safari 하단 공유 버튼 → 「홈 화면에 추가」를 눌러 설치하세요.");
      return {ok:false, status:"ios-guide"};
    }
    alert("이 브라우저에서는 자동 설치를 지원하지 않습니다.\\n\\n• Chrome/Edge: 주소창 설치 아이콘 또는 메뉴 → 앱 설치\\n• 사이트를 HTTPS로 배포해야 설치가 활성화됩니다.");
    return {ok:false, status:"unsupported"};
  };
})();
</script>
<script>
(() => {

  function fixImageAlt() {
    document.querySelectorAll('.sp-cell').forEach(card => {

      const img = card.querySelector('.sp-cell-img img');
      const name = card.querySelector('.sp-cell-name');

      if (!img || !name) return;

      const scientificName = name.textContent.trim();

      if (scientificName) {
        img.alt = `${scientificName} 이미지`;
      }

    });
  }

  fixImageAlt();

  new MutationObserver(fixImageAlt).observe(document.body, {
    childList: true,
    subtree: true
  });

})();
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  // 1. 상단 검색창 입력 시 자동 검색 결과 창(top-search-results) 토글 제어
  const searchInput = document.getElementById("q") || document.querySelector(".top-search input");
  const searchResults = document.querySelector(".top-search-results");

  if (searchInput && searchResults) {
    searchInput.addEventListener("focus", () => {
      if (searchInput.value.trim() !== "") {
        searchResults.classList.add("open");
      }
    });

    searchInput.addEventListener("input", (e) => {
      if (e.target.value.trim() !== "") {
        searchResults.classList.add("open");
      } else {
        searchResults.classList.remove("open");
      }
    });

    // 외부 클릭 시 검색 결과 닫기
    document.addEventListener("click", (e) => {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.classList.remove("open");
      }
    });
  }

  // 2. 모바일/전체화면 모달 백드롭 클릭 시 모달 닫기 이벤트 기본 연동
  const modalBacks = document.querySelectorAll(".modal-back");
  modalBacks.forEach(back => {
    back.addEventListener("click", (e) => {
      if (e.target === back) {
        back.style.display = "none";
      }
    });
  });
});
</script>
